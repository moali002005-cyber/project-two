<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتيجة الدفع · Flfluencer</title>
<link rel="icon" type="image/svg+xml" href="/brand/chili.svg?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#171D2C; --accent:#E23B2E; --soft:#5a6572; }
* { box-sizing:border-box; margin:0; }
body { font-family:'IBM Plex Sans Arabic',sans-serif; background:#FBF8F2; color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:24px; }
.logo-mark { font-size:26px; font-weight:600; direction:ltr; }
.card { background:#fff; border:1px solid #EAE5DA; border-radius:22px; padding:44px 36px; max-width:440px; width:100%;
  text-align:center; box-shadow:0 18px 50px -28px rgba(15,20,32,.18); }
.ic { width:76px; height:76px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; }
.ic.ok { background:#1F9D6B; } .ic.bad { background:#C0231A; } .ic.wait { background:#E8A20C; }
h1 { font-size:22px; margin-bottom:10px; }
p { font-size:14.5px; color:var(--soft); line-height:1.9; }
.btn { display:inline-block; margin-top:22px; background:linear-gradient(135deg,#EE5A44,#C0231A); color:#fff;
  text-decoration:none; font-weight:700; font-size:14px; padding:13px 30px; border-radius:100px; border:0; cursor:pointer; font-family:inherit; }
.spin { width:44px; height:44px; border:4px solid #F0A79E; border-top-color:var(--accent); border-radius:50%;
  margin:0 auto 18px; animation:sp 0.8s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<img src="/brand/logo-nav.svg" alt="Flfluencer" style="height:38px;display:block">
<div class="card" id="card">
  <div class="spin"></div>
  <h1>نتأكد من دفعتك...</h1>
  <p>لحظات — نتحقق مباشرة من بوابة الدفع.</p>
</div>
<script>
(async function () {
  const card = document.getElementById('card');
  const ref = new URLSearchParams(location.search).get('ref') || '';
  function show(icon, cls, title, desc, btnLabel) {
    card.innerHTML = '<div class="ic ' + cls + '">' + icon + '</div><h1>' + title + '</h1><p>' + desc + '</p>'
      + '<a class="btn" href="/campaigns.html">' + btnLabel + '</a>';
  }
  if (!ref) { show('!', 'bad', 'رابط غير مكتمل', 'ارجع لحملاتك وحاول من جديد.', 'الرجوع للحملات'); return; }
  // نحاول عدة مرات — أحياناً التأكيد ياخذ ثواني
  for (let i = 0; i < 6; i++) {
    try {
      const res = await fetch('/api/pay-create?ref=' + encodeURIComponent(ref));
      const out = await res.json();
      if (out.status === 'paid') {
        show('✓', 'ok', 'تم الدفع بنجاح 🎉', 'صفقاتك المعتمدة صارت مضمونة ومفعّلة، وانرسل إشعار للمعلنين ليبدؤون التنفيذ.', 'الرجوع لحملاتي');
        return;
      }
      if (out.status === 'failed') {
        show('✕', 'bad', 'ما اكتمل الدفع', 'العملية ألغيت أو فشلت. ما انخصم منك شي — تقدر تعيد المحاولة من صفحة الحملة.', 'الرجوع للحملات');
        return;
      }
    } catch (e) { console.error(e); }
    await new Promise(r => setTimeout(r, 2500));
  }
  show('⏳', 'wait', 'الدفعة قيد المعالجة', 'البنك ما أكّد العملية بعد. حدّث الصفحة بعد دقيقة — ولو انخصم منك ولم تتفعل الصفقات تواصل معنا على hello@flfluencer.com.', 'الرجوع للحملات');
})();
</script>
</body>
</html>
