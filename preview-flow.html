eight:18px;transform:translateY(-50%);border-radius:0 999px 999px 0;background:linear-gradient(90deg,rgba(255,201,168,.95),rgba(226,59,46,.75),rgba(240,114,95,0));filter:blur(1px)}.fh .rkw.in .rkfin1,.fh .rkw.in .rkfin2{transform-box:fill-box;transform-origin:0% 50%}@keyframes rkfl{from{transform:translateY(-50%) scaleX(.82)}to{transform:translateY(-50%) scaleX(1.12)}}.fh .rkp{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:1.6px solid #F3E3DE;display:flex;align-items:center;justify-content:center;opacity:0;will-change:transform}.fh .rkp i{width:16px;height:16px;border-radius:50%;display:block}.fh .rkp svg{position:absolute;width:12px;height:12px;opacity:0}.fh .rkp svg path{stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.fh .rkg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:stretch;will-change:transform}.fh .rkcell{display:flex;flex-direction:column;opacity:.45;transform:translateY(6px);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.3,1)}.fh .rkcell.on{opacity:1;transform:none}.fh .rkcell .wnwin{transition:box-shadow .45s ease,border-color .45s ease}.fh .rkcell.on .wnwin{border-color:rgba(226,59,46,.22);box-shadow:0 26px 52px -30px rgba(226,59,46,.4),0 1px 4px rgba(26,21,18,.04)}.fh .rkcell .wnview{min-height:132px;padding:14px 12px 16px;gap:0}.fh .rkcell .wnview h4{font-size:15px;margin:8px 0 4px}.fh .rkcell .wnview p{font-size:10.5px}.fh .rkmark{opacity:0;transform:scale(.7);transition:opacity .4s ease,transform .5s cubic-bezier(.2,1.5,.4,1)}.fh .rkcell.on .rkmark{opacity:1;transform:none}.fh .rkt{margin-top:10px;text-align:center;font-size:11.5px;font-weight:700;color:#B0A29D;transition:color .4s ease}.fh .rkcell.on .rkt{color:#8A807B}.fh .rkt b{font-family:var(--font-display);font-size:16px;font-weight:800;color:#D9BDB6;direction:ltr;display:block;margin-bottom:1px;transition:color .4s ease}.fh .rkcell.on .rkt b{color:#E23B2E}@media(max-width:900px){.fh .rkg{grid-template-columns:repeat(2,1fr)}.fh .rksky{height:120px}}@media(max-width:560px){.fh .rkg{grid-template-columns:1fr}}@media(max-width:900px){.fh .wng{grid-template-columns:1fr;gap:14px 0}.fh .wnar{height:26px;width:2px;margin:0 auto;background:repeating-linear-gradient(180deg,#E7D3CD 0 5px,transparent 5px 11px)}.fh .wnar::after{inset-inline-start:-4px;top:auto;bottom:-1px;border-inline:5px solid transparent;border-block-start:7px solid #E0C9C2;border-block-end:0}}@media(prefers-reduced-motion:reduce){.fh .wnc{opacity:1;transform:none;transition:none}.fh .rkw.in .wncur,.fh .rkw.in .wncount i{animation:none}.fh .wnok path{stroke-dashoffset:0}}

<div class="pv"><div class="pvbar"><span>معاينة قسم «السرعة» بخطوط المنصة وألوانها — يعيد نفسه تلقائياً كل بضع ثوانٍ.</span>
<button class="pvbtn" id="rep" type="button">شغّل من البداية</button></div></div>
<div class="fh"><sect><div class="w"><div class="sh"><div class="eb">آلية العمل</div><h2>فريق كامل… في ضغطة وحدة.</h2><p>بدل اجتماع وتنسيق ومتابعة بين فريق كامل — تنشئ الحملة، والمنصة تمشّي الباقي.</p></div><div class="mtstage in" id="mtStage"><svg id="mtSvg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="mtA"><defs><linearGradient id="flfG" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="900" y2="380"><stop offset="0%" stop-color="#7C51A0"></stop><stop offset="25%" stop-color="#3777BB"></stop><stop offset="50%" stop-color="#0DA64F"></stop><stop offset="75%" stop-color="#F5B417"></stop><stop offset="100%" stop-color="#E4342B"></stop></linearGradient></defs><path d="" fill="none" stroke="url(#flfG)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.10"></path><path d="" fill="none" stroke="url(#flfG)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></g><g id="mtB"></g></svg><div class="mtcap p1" id="mtCap"><span class="c1">اجتماع، وتنسيق، ومتابعة…</span><span class="c2">ضغطة وحدة.</span></div></div></div></sect></div>
<script>
(function(){
function mtWire(){
 var stage=document.getElementById('mtStage'); if(!stage) return;
 var gA=document.getElementById('mtA'), gB=document.getElementById('mtB');
 var cap=document.getElementById('mtCap');
 var NS='http://www.w3.org/2000/svg';
 function E(t,a,p){var e=document.createElementNS(NS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
 function cl(v,a,b){return v<a?a:(v>b?b:v);}
 function seg(t,a,b){return cl((t-a)/(b-a),0,1);}
 function ease(t){t=cl(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
 function out3(t){t=cl(t,0,1);return 1-Math.pow(1-t,3);}
 function lerp(a,b,t){return a+(b-a)*t;}
 var LC=['#7C51A0','#3777BB','#0DA64F','#F5B417','#E4342B'];

 /* ===== تدرّج ألوان الهوية على الخط ===== */
 var defs=E('defs',null,gA);
 var lg=E('linearGradient',{id:'flfG',gradientUnits:'userSpaceOnUse',x1:'0',y1:'60',x2:'900',y2:'380'},defs);
 var stops=LC.map(function(c,i){ return E('stop',{offset:(i/(LC.length-1)*100)+'%','stop-color':c},lg); });
 var line=E('path',{d:'',fill:'none',stroke:'url(#flfG)','stroke-width':'2.2','stroke-linecap':'round','stroke-linejoin':'round'},gA);
 var glow=E('path',{d:'',fill:'none',stroke:'url(#flfG)','stroke-width':'7','stroke-linecap':'round','stroke-linejoin':'round',opacity:'0.10'},gA);
 gA.insertBefore(glow,line);

 /* ===== أخذ عيّنات من المسارات ===== */
 var probe=E('svg',{width:'0',height:'0',style:'position:absolute;left:-9999px'},document.body);
 function sample(dList,N){
  var ps=dList.map(function(d){var p=E('path',{d:d},probe);return {p:p,L:p.getTotalLength()};});
  var tot=ps.reduce(function(a,o){return a+o.L;},0)||1;
  var out=[], used=0;
  ps.forEach(function(o,i){
   var n=Math.max(2, Math.round(N*o.L/tot));
   if(i===ps.length-1) n=Math.max(2,N-used);
   used+=n;
   for(var k=0;k<n;k++){ var q=o.p.getPointAtLength(o.L*(k/(n-1))); out.push([q.x,q.y]); }
  });
  ps.forEach(function(o){ probe.removeChild(o.p); });
  while(out.length<N) out.push(out[out.length-1]);
  return out.slice(0,N);
 }
 var N=440;
 function toD(pts){
  var s='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=1;i<pts.length;i++) s+=' L '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
  return s;
 }
 function mix(a,b,t){
  var o=new Array(N);
  for(var i=0;i<N;i++) o[i]=[a[i][0]+(b[i][0]-a[i][0])*t, a[i][1]+(b[i][1]-a[i][1])*t];
  return o;
 }

 /* ===== شخص بخط واحد ===== */
 function bust(x,y,s,lean){
  function m(px,py){ return (x+px*s).toFixed(1)+' '+(y+py*s).toFixed(1); }
  var k=lean||0;
  return ['M '+m(0,31)+' L '+m(2,26)+' L '+m(4,-1)+' L '+m(0,-4)+' L '+m(-4,-1)+' L '+m(-2,26)+' Z',
   'M '+m(9,-17)+' L '+m(0,-4)+' L '+m(-9,-17),
   'M '+m(0,-62)+' C '+m(11,-62)+' '+m(17,-53)+' '+m(17,-43)
   +' C '+m(17,-33)+' '+m(11,-26)+' '+m(3,-24)+' L '+m(3,-16)
   +' C '+m(22+k,-12)+' '+m(34+k,-2)+' '+m(36+k,16)+' L '+m(38+k,54)
   +' L '+m(22,54)+' L '+m(20,20)+' L '+m(14,54)+' L '+m(-14,54)
   +' L '+m(-20,20)+' L '+m(-22,54)+' L '+m(-38+k,54)
   +' L '+m(-36+k,16)+' C '+m(-34+k,-2)+' '+m(-22+k,-12)+' '+m(-3,-16)
   +' L '+m(-3,-24)+' C '+m(-11,-26)+' '+m(-17,-33)+' '+m(-17,-43)
   +' C '+m(-17,-53)+' '+m(-11,-62)+' '+m(0,-62)+' Z'];
 }
 function fullFig(x,y,s,armUp){
  function m(px,py){ return (x+px*s).toFixed(1)+' '+(y+py*s).toFixed(1); }
  var A=['M '+m(0,-94)+' L '+m(2,-100)+' L '+m(4,-133)+' L '+m(0,-136)+' L '+m(-4,-133)+' L '+m(-2,-100)+' Z',
   'M '+m(9,-150)+' L '+m(0,-136)+' L '+m(-9,-150),
   'M '+m(0,-196)+' C '+m(11,-196)+' '+m(17,-187)+' '+m(17,-177)
   +' C '+m(17,-167)+' '+m(11,-159)+' '+m(3,-157)+' L '+m(3,-149)
   +' C '+m(21,-145)+' '+m(33,-136)+' '+m(35,-120)+' L '+m(39,-82)
   +' C '+m(40,-72)+' '+m(35,-68)+' '+m(31,-70)+' C '+m(28,-72)+' '+m(27,-76)+' '+m(27,-82)
   +' L '+m(23,-114)+' L '+m(21,-84)+' L '+m(27,-12)
   +' C '+m(28,-4)+' '+m(23,0)+' '+m(19,-2)+' C '+m(16,-4)+' '+m(15,-8)+' '+m(14,-14)
   +' L '+m(7,-78)+' L '+m(-7,-78)+' L '+m(-14,-14)
   +' C '+m(-15,-8)+' '+m(-16,-4)+' '+m(-19,-2)+' C '+m(-23,0)+' '+m(-28,-4)+' '+m(-27,-12)
   +' L '+m(-21,-84)+' L '+m(-23,-114)+' L '+m(-27,-82)
   +' C '+m(-27,-76)+' '+m(-28,-72)+' '+m(-31,-70)+' C '+m(-35,-68)+' '+m(-40,-72)+' '+m(-39,-82)
   +' L '+m(-35,-120)+' C '+m(-33,-136)+' '+m(-21,-145)+' '+m(-3,-149)+' L '+m(-3,-157)
   +' C '+m(-11,-159)+' '+m(-17,-167)+' '+m(-17,-177)+' C '+m(-17,-187)+' '+m(-11,-196)+' '+m(0,-196)+' Z'];
  if(armUp) A.push('M '+m(33,-126)+' C '+m(52,-140)+' '+m(66,-152)+' '+m(76,-166));
  return A;
 }

 /* ===== المشاهد ===== */
 var SC={}, ready=0;
 function build(){
  /* اجتماع مزدحم */
  var crowd=[];
  [[128,300,1.02],[268,290,0.94],[408,284,0.9],[548,290,0.94],[688,300,1.02],[822,312,1.1]].forEach(function(o,i){
   crowd=crowd.concat(bust(o[0],o[1],o[2],(i%2?6:-6)));
  });
  crowd.push('M 40 358 L 860 358');
  crowd.push('M 200 358 L 200 330 L 268 330 L 268 358');
  crowd.push('M 620 358 L 620 330 L 688 330 L 688 358');
  SC.crowd=sample(crowd,N);
  /* شخص واحد + شاشة */
  var hero=['M 108 384 L 430 384'];
  hero=hero.concat(fullFig(250,384,1.0,true));
  hero.push('M 430 384 L 430 200 L 742 200 L 742 384 L 430 384');
  hero.push('M 462 238 L 710 238');
  hero.push('M 710 268 L 508 268');
  hero.push('M 490 300 L 686 300 A 19 19 0 0 1 686 338 L 490 338 A 19 19 0 0 1 490 300 Z');
  hero.push('M 742 384 L 800 384');
  SC.hero=sample(hero,N);
 }

 var LOOP=17.0, t0=null, running=false, st=-1;
 function setPhase(k){ if(k===st)return; st=k; cap.className='mtcap p'+k; }

 fetch('/brand/chili.svg').then(function(r){return r.text();}).then(function(txt){
  var doc=new DOMParser().parseFromString(txt,'image/svg+xml'), src=doc.documentElement;
  var vb=(src.getAttribute('viewBox')||'0 0 300 300').split(/[\s,]+/).map(Number);
  var sc=286/vb[3], cx=vb[0]+vb[2]/2, cy=vb[1]+vb[3]/2;
  var tmp=E('g',{transform:'translate(450,214) scale('+sc.toFixed(4)+') translate('+(-cx)+','+(-cy)+')'},probe);
  var ds=[].slice.call(src.querySelectorAll('path')).map(function(pp){
   var p=E('path',{d:pp.getAttribute('d')},tmp);
   var L=p.getTotalLength(), out=[], n=Math.max(8,Math.round(L/3));
   for(var k=0;k<n;k++){ var q=p.getPointAtLength(L*(k/(n-1))); var m=p.getCTM(), s2=probe.createSVGPoint(); s2.x=q.x; s2.y=q.y; var r=s2.matrixTransform(m); out.push([r.x,r.y]); }
   return out;
  });
  /* حوّل نقاط الشعار إلى N */
  var flat=[]; ds.forEach(function(a){ flat=flat.concat(a); });
  var pts=[]; for(var i=0;i<N;i++){ pts.push(flat[Math.floor(i*flat.length/N)]); }
  SC.logo=pts;
  probe.removeChild(tmp);
  build(); ready=1;
 })['catch'](function(){ build(); SC.logo=SC.crowd; ready=1; });

 function frame(now){
  if(!running) return;
  if(t0===null) t0=now;
  var t=((now-t0)/1000)%LOOP;
  if(!ready){ requestAnimationFrame(frame); return; }

  var pts;
  if(t<3.0)      pts=SC.logo;
  else if(t<5.0) pts=mix(SC.logo,SC.crowd,ease(seg(t,3.0,5.0)));
  else if(t<7.6) pts=SC.crowd;
  else if(t<9.6) pts=mix(SC.crowd,SC.hero,ease(seg(t,7.6,9.6)));
  else if(t<13.6)pts=SC.hero;
  else           pts=mix(SC.hero,SC.logo,ease(seg(t,13.6,15.6)));

  /* تنفّس خفيف */
  var br=Math.sin(t*1.1)*1.4, out=[];
  for(var i=0;i<N;i++){ out.push([pts[i][0]+Math.sin(i*0.09+t*1.6)*br, pts[i][1]+Math.cos(i*0.07+t*1.3)*br]); }
  var d=toD(out);
  line.setAttribute('d',d); glow.setAttribute('d',d);

  /* حركة الألوان على الخط */
  var ph=(t*70)%1800-450;
  lg.setAttribute('x1',ph.toFixed(0)); lg.setAttribute('x2',(ph+900).toFixed(0));

  /* كاميرا لا تثبت */
  var s=1+0.04*Math.sin(t*0.42), dx=10*Math.sin(t*0.33), dy=6*Math.cos(t*0.27);
  var zoom=1+0.10*ease(seg(t,9.6,11.6))-0.10*ease(seg(t,12.4,13.6));
  gA.setAttribute('transform','translate(450,220) scale('+(s*zoom).toFixed(4)+') translate('+(-450+dx).toFixed(1)+','+(-220+dy).toFixed(1)+')');

  line.setAttribute('stroke-width',(2.2/(s*zoom)).toFixed(2));
  glow.setAttribute('opacity',(0.09+0.07*Math.sin(t*2.1)).toFixed(3));

  setPhase(t<7.6?1:2);
  requestAnimationFrame(frame);
 }
 function start(){ if(running)return; running=true; t0=null; requestAnimationFrame(frame); }
 stage.classList.add('in');
 if(!('IntersectionObserver' in window)){ start(); return; }
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)start();});},{threshold:0.2});
 io.observe(stage);
}

 mtWire();
 document.getElementById('rep').addEventListener('click',function(){ location.reload(); });
})();
</script>
