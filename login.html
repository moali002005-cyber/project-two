<style>
:root {
  --cream: #ffffff;
  --cream-darker: #F3EEE4;
  --ink: #0F1420;
  --ink-soft: #2C3548;
  --ink-muted: #8A93A6;
  --ink-faint: #AAB2C0;
  --accent: #E23B2E;
  --accent-soft: #F0A79E;
  --accent-ink: #7E2119;
  --line: rgba(15, 20, 32, 0.08);
  --line-strong: rgba(15, 20, 32, 0.16);
  --font-display: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-serif: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; width: 100%; position: relative; z-index: 2; }

.nav { padding: 24px 0; border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.logo-eye { width: 44px; height: 44px; display: block; flex-shrink: 0; }
.logo-mark {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0;
  position: relative;
}
.logo-mark::after {
  content: '';
  position: absolute;
  bottom: 6px;
  inset-inline-end: -8px;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}
.back-link { color: var(--ink-soft); text-decoration: none; font-size: 14px; }
.back-link:hover { color: var(--accent); }

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  position: relative;
  z-index: 2;
}

.login-card {
  background: #fff;
  border-radius: 24px;
  padding: 48px;
  max-width: 480px;
  width: 100%;
  border: 1px solid var(--line);
  box-shadow: 0 18px 50px -28px rgba(15,20,32,.2);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--accent-ink);
  margin-bottom: 16px;
}
.eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--accent); }

h1 {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-bottom: 12px;
}
h1 .italic { font-family: var(--font-display); font-style: normal; color: var(--accent); }

.subtitle { font-size: 15px; color: var(--ink-soft); margin-bottom: 32px; }

.field { margin-bottom: 20px; }
.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding-inline-end: 44px; }
.pw-eye {
  position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; cursor: pointer; padding: 4px; display: flex;
  border-radius: 8px; opacity: .85; transition: opacity .15s;
}
.pw-eye:hover { opacity: 1; }
.pw-eye svg { width: 22px; height: 22px; display: block; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; }
input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 15px;
  background: #fff;
  color: var(--ink);
  transition: all 0.2s;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(226,59,46, 0.14);
}
input::placeholder { color: var(--ink-faint); }

.btn-submit {
  display: block;
  width: 100%;
  padding: 16px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-submit:hover { background: var(--accent); transform: translateY(-1px); }
.btn-submit:disabled { background: var(--ink-faint); cursor: not-allowed; transform: none; }

.tabs {
  display: flex;
  gap: 6px;
  background: var(--cream-darker);
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 11px;
  border: none;
  background: transparent;
  border-radius: 9px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(15,20,32,0.06); }
.pane { display: none; }
.pane.active { display: block; }
.muted-link {
  display: inline;
  background: none;
  border: none;
  color: var(--accent-ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
.field-hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }

.error-box {
  display: none;
  padding: 14px 16px;
  background: var(--cream-darker);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 20px;
}
.error-box.show { display: block; }
.error-box a { color: var(--accent-ink); font-weight: 500; text-decoration: underline; }

.bottom-link {
  text-align: center;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink-muted);
}
.bottom-link a { color: var(--accent-ink); text-decoration: none; font-weight: 500; }

.info-note {
  font-size: 13px;
  color: var(--ink-muted);
  background: var(--cream-darker);
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  line-height: 1.6;
}

@media (max-width: 540px) {
  .login-card { padding: 32px 24px; }
  h1 { font-size: 28px; }
  .logo-eye { width: 38px; height: 38px; }
}
</style>

<script>
function switchTab(which) {
  const isPw = which === 'password';
  document.getElementById('tab-password').classList.toggle('active', isPw);
  document.getElementById('tab-otp').classList.toggle('active', !isPw);
  document.getElementById('pane-password').classList.toggle('active', isPw);
  document.getElementById('pane-otp').classList.toggle('active', !isPw);
  hideError();
}

function showError(html) {
  const box = document.getElementById('error-box');
  box.innerHTML = html;
  box.classList.add('show');
}
function hideError() {
  document.getElementById('error-box').classList.remove('show');
}

// بعد نجاح المصادقة: نجيب ملف المستخدم من جدول users ونوجّهه
async function finishLogin(email, authUser) {
  let profile = null;

  // نحاول الربط عبر auth_id أولاً
  if (authUser && authUser.id) {
    const { data } = await supabaseClient
      .from('users').select('id, role, name, platform, handle, followers, category, price, bio, company_name, industry, size, position, website, created_at, auth_id, approval_status, cr_number, is_test').eq('auth_id', authUser.id).maybeSingle();
    profile = data || null;
  }
  // احتياطي: عبر دالة آمنة تُرجّع ملف المتصل نفسه فقط (ونربط auth_id لو ناقص)
  if (!profile && email) {
    const { data } = await supabaseClient.rpc('simbl_find_own_profile');
    profile = (Array.isArray(data) && data[0]) ? data[0] : null;
    if (profile && authUser && authUser.id && !profile.auth_id) {
      try {
        await supabaseClient.from('users').update({ auth_id: authUser.id }).eq('id', profile.id);
      } catch (e) {}
    }
  }

  if (!profile) {
    // حساب مصادقة صحيح لكن بلا ملف (يتيم) — نبقي الجلسة ونوجّهه لإكمال ملفه
    // بدل الطريق المسدود. صفحة التسجيل تكتشف الجلسة وتفتح «وضع الإكمال».
    window.location.href = '/signup.html?complete=1';
    return false;
  }

  saveCurrentUser(profile);
  if (profile.role === 'creator') {
    window.location.href = '/creator.html';
  } else if (profile.role === 'brand') {
    window.location.href = '/brand.html';
  } else {
    showError('نوع الحساب غير معروف.');
    return false;
  }
  return true;
}

// إظهار/إخفاء كلمة السر (يكشف فقط ما كتبه المستخدم — آمن)
function togglePwVisibility() {
  const inp = document.getElementById('pw-password');
  const btn = document.getElementById('pw-eye-btn');
  if (!inp) return;
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  if (btn) {
    const open = btn.querySelector('.pw-eye-open');
    const off = btn.querySelector('.pw-eye-off');
    if (open) open.style.display = show ? 'none' : 'block';
    if (off) off.style.display = show ? 'block' : 'none';
    btn.setAttribute('aria-label', show ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
    btn.setAttribute('title', show ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
  }
}
async function loginWithPassword(event) {
  event.preventDefault();
  hideError();
  const email = document.getElementById('pw-email').value.trim().toLowerCase();
  const password = document.getElementById('pw-password').value;
  const btn = document.getElementById('pw-btn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      if ((error.message || '').toLowerCase().includes('invalid')) {
        showError('البريد الإلكتروني أو كلمة السر غير صحيحة.');
      } else {
        showError('حصل خطأ. حاول مرة أخرى.');
      }
      btn.disabled = false; btn.textContent = 'دخول';
      return;
    }
    await finishLogin(email, data.user);
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. حاول مرة أخرى.');
    btn.disabled = false; btn.textContent = 'دخول';
  }
}

// ===== طريقة كود الإيميل (OTP) =====
let otpEmail = '';

async function sendOtp(event) {
  if (event) event.preventDefault();
  hideError();
  otpEmail = document.getElementById('otp-email').value.trim().toLowerCase();
  const btn = document.getElementById('otp-send-btn');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...';

  try {
    // shouldCreateUser:false → لا ننشئ حساب جديد من صفحة الدخول
    const { error } = await supabaseClient.auth.signInWithOtp({
      email: otpEmail,
      options: { shouldCreateUser: false }
    });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('not') && (m.includes('found') || m.includes('exist') || m.includes('signups'))) {
        showError('لا يوجد حساب بهذا البريد. <a href="/signup.html">سجل حساب جديد</a>');
      } else {
        showError('تعذّر إرسال الكود. تأكد من البريد وحاول مرة أخرى.');
      }
      btn.disabled = false; btn.textContent = 'إرسال الكود';
      return;
    }
    document.getElementById('otp-email-label').textContent = otpEmail;
    document.getElementById('otp-email-form').style.display = 'none';
    document.getElementById('otp-code-form').style.display = 'block';
    document.getElementById('otp-code').focus();
    btn.disabled = false; btn.textContent = 'إرسال الكود';
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. حاول مرة أخرى.');
    btn.disabled = false; btn.textContent = 'إرسال الكود';
  }
}

function resendOtp() { if (otpEmail) sendOtp(); }
function resetOtp() {
  hideError();
  document.getElementById('otp-code-form').style.display = 'none';
  document.getElementById('otp-email-form').style.display = 'block';
  document.getElementById('otp-code').value = '';
}

async function verifyOtp(event) {
  event.preventDefault();
  hideError();
  const token = document.getElementById('otp-code').value.trim();
  const btn = document.getElementById('otp-verify-btn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try {
    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: otpEmail,
      token,
      type: 'email'
    });
    if (error) {
      showError('الكود غير صحيح أو منتهي. أعد المحاولة.');
      btn.disabled = false; btn.textContent = 'تأكيد ودخول';
      return;
    }
    await finishLogin(otpEmail, data.user);
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. حاول مرة أخرى.');
    btn.disabled = false; btn.textContent = 'تأكيد ودخول';
  }
}
</script>
