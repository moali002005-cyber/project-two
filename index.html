<style>
:root {
  --cream: #ffffff;
  --cream-darker: #F3EEE4;
  --ink: #0F1420;
  --ink-soft: #2C3548;
  --ink-muted: #8A93A6;
  --ink-faint: #AAB2C0;
  --accent: #E23B2E;
  --accent-soft: #F0A79E;
  --accent-ink: #7E2119;
  --olive: #5b5b5b;
  --gold: #D4A24C;
  --line: rgba(15, 20, 32, 0.08);
  --line-strong: rgba(15, 20, 32, 0.16);
  --font-display: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-serif: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}
.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }
.nav {
  padding: 32px 0;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  z-index: 50;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; }
.logo {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-decoration: none;
  color: var(--ink);
}
.logo-eye { width: 72px; height: 72px; display: block; flex-shrink: 0; }
.logo-pupil {
  transform-box: fill-box;
  transform-origin: center;
  animation: logoLook 6s ease-in-out infinite;
}
@keyframes logoLook {
  0%, 12% { transform: translate(0, 0); }
  24% { transform: translate(6px, 0); }
  40% { transform: translate(-6px, 0); }
  52% { transform: translate(0, 2px); }
  64% { transform: translate(0, 0); }
  72% { transform: translate(0, 0) scaleY(0.15); }
  76% { transform: translate(0, 0) scaleY(1); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) { .logo-pupil { animation: none; } }
.logo-mark {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  position: relative;
}
.logo-mark::after{content:none}
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-links a:not(.btn) {
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
  transition: color 0.2s;
}
.nav-links a:not(.btn):hover { color: var(--accent); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary { background: linear-gradient(160deg,#EE5A44,#E23B2E 55%,#B4271C); color: #fff; font-weight: 700;
  box-shadow: 0 10px 22px -10px rgba(226,59,46,.55); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px rgba(226,59,46,.7); }
.btn-ghost { background: transparent; color: var(--ink); border: none; font-weight: 600; padding-inline: 14px; }
.btn-ghost:hover { color: var(--accent); }
.lang-toggle { padding: 10px 10px; font-weight: 600; min-width: 44px; justify-content: center; color: #8B8578; }
.lang-toggle:hover { color: var(--accent); }
.hero {
  min-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 0 56px;
  position: relative;
}
.hero .container { width: 100%; }
.hero-grid { width: min(760px, 100%); margin: 0 auto; text-align: center; }
.hero-story{display:flex;flex-direction:column;align-items:center;gap:24px;margin-bottom:38px}
.hs-brand{position:relative;display:flex;align-items:center;justify-content:center;will-change:transform}
.hs-brand .bm{position:relative;font-family:var(--font-display);font-weight:700;font-size:clamp(32px,5vw,44px);color:var(--ink);letter-spacing:-.01em;direction:ltr}
.hs-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,80vw);height:150px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,59,46,.20),transparent);pointer-events:none}
.hs-sents{position:relative;height:46px;width:100%}
.hs-s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:clamp(18px,3.4vw,27px);font-weight:800;color:var(--ink);opacity:0;white-space:nowrap;will-change:transform,opacity}
.hs-stage{width:min(520px,88vw)}
.hs-stage svg{display:block;width:100%;height:auto;overflow:visible}

.cta-flow{display:flex;justify-content:center;align-items:center;gap:34px;width:min(760px,100%);margin:14px auto 0;padding:14px 0 10px}
.cta-flow .fbtn{position:relative;width:224px;height:58px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;font-weight:800;font-size:16.5px;text-decoration:none;transition:transform .25s ease,border-radius .25s ease}
.cta-flow .fbtn .leaf{position:absolute;top:-14px;width:26px;pointer-events:none}
.cta-flow .fbtn.primary{background:linear-gradient(160deg,#EE5A44 0%,#E23B2E 45%,#B4271C 100%);color:#fff;animation:flameGlow 2.2s ease-in-out infinite alternate}
.cta-flow .fbtn.primary .leaf{right:10px;transform:rotate(-28deg)}
.cta-flow .fbtn.ghost{background:#fff;border:1.6px solid #F2C4BC;color:var(--ink);animation:flameGlowSoft 2.2s ease-in-out infinite alternate;animation-delay:.55s}
.cta-flow .fbtn.ghost .leaf{left:10px;transform:rotate(28deg) scaleX(-1)}
.cta-flow .fbtn:hover{transform:translateY(-3px);border-radius:100px}
@keyframes flameGlow{
  0%{box-shadow:0 6px 18px -6px rgba(226,59,46,.55),0 0 26px rgba(226,59,46,.35),0 0 52px rgba(240,122,47,.18)}
  100%{box-shadow:0 8px 22px -6px rgba(226,59,46,.75),0 0 40px rgba(226,59,46,.55),0 0 84px rgba(240,122,47,.35)}
}
@keyframes flameGlowSoft{
  0%{box-shadow:0 4px 14px -6px rgba(226,59,46,.3),0 0 18px rgba(226,59,46,.18),0 0 40px rgba(240,122,47,.10)}
  100%{box-shadow:0 6px 18px -6px rgba(226,59,46,.45),0 0 30px rgba(226,59,46,.32),0 0 62px rgba(240,122,47,.20)}
}
@media (prefers-reduced-motion: reduce){
  .cta-flow .fbtn.primary,.cta-flow .fbtn.ghost{animation:none;box-shadow:0 6px 20px -6px rgba(226,59,46,.5),0 0 30px rgba(226,59,46,.35)}
}
@media(max-width:840px){
  .cta-flow{flex-direction:column;gap:14px}
  .cta-flow .fbtn{width:min(320px,86vw)}
  .cta-flow .fbtn .leaf{display:none}
}

.hero-desc {
  font-size: 16px;
  color: var(--ink-soft);
  font-weight: 400;
  max-width: 440px;
  margin: 0 auto 36px;
  line-height: 1.7;
}
/* legacy */
.hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.hero-cta-lg { padding: 17px 30px; font-size: 15px; }
.hero-steps {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 56px;
  padding-top: 36px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.hstep {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  animation: stepFlow 3s ease-in-out infinite;
}
.hstep .ic {
  width: 34px; height: 34px;
  flex: none; border-radius: 50%;
  background: rgba(226,59,46, 0.12);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  animation: stepIc 3s ease-in-out infinite;
}
.hstep .ic svg { width: 18px; height: 18px; display: block; }
.hstep .t { font-size: 14px; font-weight: 600; color: var(--ink); }
.hstep:nth-child(2), .hstep:nth-child(2) .ic { animation-delay: 1s; }
.hstep:nth-child(3), .hstep:nth-child(3) .ic { animation-delay: 2s; }
@keyframes stepFlow {
  0%, 25%, 100% { border-color: var(--line); box-shadow: none; transform: translateY(0); }
  8%, 17% { border-color: var(--accent); box-shadow: 0 8px 20px rgba(226,59,46, 0.18); transform: translateY(-4px); }
}
@keyframes stepIc {
  0%, 25%, 100% { background: rgba(226,59,46, 0.12); color: var(--accent); }
  8%, 17% { background: var(--accent); color: #fff; }
}
.footer { padding: 56px 0 40px; border-top: 1px solid var(--line); }
.footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 24px; }
.footer-info { display: flex; align-items: center; gap: 14px; color: var(--ink-muted); font-size: 13px; }
.footer-info .logo-eye { width: 28px; height: 28px; }
.footer-links { display: flex; gap: 28px; }
.footer-links a { color: var(--ink-muted); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.footer-links a:hover { color: var(--ink); }
@media (max-width: 980px) {
  .nav-links a:not(.btn) { display: none; }
  .hero-steps { gap: 24px; }
  .hero { padding: 32px 0 48px; }
}
@media (max-width: 600px) {
  .container { padding: 0 20px; }
  .logo-eye { width: 52px; height: 52px; }
  .logo-mark { font-size: 13px; }
  .hero-steps { gap: 12px; }
}
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s, transform 0.8s; }
.reveal.visible { opacity: 1; transform: translateY(0); }

(function installPrompt() {
  // لا تظهر لو التطبيق مثبّت ومفتوح من الأيقونة أصلاً
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;
  // لا تظهر لو المستخدم رفضها قبل
  if (localStorage.getItem('simbl_install_dismissed')) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);
  // أجهزة الجوال فقط (الكمبيوتر ما يحتاج)
  if (!isIOS && !isAndroid) return;

  var deferredPrompt = null;

  // أندرويد/كروم: نلتقط حدث التثبيت التلقائي
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    showBanner('android');
  });

  // آيفون: ما فيه حدث تلقائي، نعرض التعليمات بعد ثانيتين
  if (isIOS) {
    setTimeout(function(){ showBanner('ios'); }, 2500);

  function dismiss(banner) {
    localStorage.setItem('simbl_install_dismissed', '1');
    if (banner) {
      banner.style.opacity = '0';
      banner.style.transform = 'translateY(20px)';
      setTimeout(function(){ banner.remove(); }, 300);

    if (type === 'android') {
      banner.innerHTML = eye +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;font-size:15px;margin-bottom:2px;">ثبّت Flfluencer على جوالك</div>' +
          '<div style="font-size:12px;opacity:0.8;line-height:1.5;">وصول أسرع وإشعارات فورية</div>' +
        '</div>' +
        '<button id="simbl-install-go" style="background:#E23B2E;color:#fff;border:none;padding:10px 20px;border-radius:100px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;">تثبيت</button>' +
        '<button id="simbl-install-x" style="background:transparent;color:#fff;border:none;padding:4px 6px;font-size:22px;cursor:pointer;opacity:0.6;line-height:1;flex-shrink:0;" aria-label="إغلاق">&times;</button>';
      document.body.appendChild(banner);
      requestAnimationFrame(function(){ banner.style.opacity = '1'; banner.style.transform = 'translateY(0)'; });

      document.getElementById('simbl-install-go').onclick = async function() {
        if (!deferredPrompt) { dismiss(banner); return; }
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) {}
        deferredPrompt = null;
        dismiss(banner);
      };
      document.getElementById('simbl-install-x').onclick = function(){ dismiss(banner); };
    } else {
      // آيفون: تعليمات يدوية
      banner.innerHTML = eye +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;font-size:15px;margin-bottom:2px;">أضِف Flfluencer لشاشتك</div>' +
          '<div style="font-size:12px;opacity:0.85;line-height:1.6;">اضغط زر المشاركة <span style="display:inline-block;border:1px solid rgba(255,255,255,0.5);border-radius:5px;padding:0 5px;">&#8593;</span> بالأسفل، ثم اختر <strong>«إضافة إلى الشاشة الرئيسية»</strong></div>' +
        '</div>' +
        '<button id="simbl-install-x" style="background:transparent;color:#fff;border:none;padding:4px 6px;font-size:22px;cursor:pointer;opacity:0.6;line-height:1;flex-shrink:0;" aria-label="إغلاق">&times;</button>';
      document.body.appendChild(banner);
      requestAnimationFrame(function(){ banner.style.opacity = '1'; banner.style.transform = 'translateY(0)'; });
      document.getElementById('simbl-install-x').onclick = function(){ dismiss(banner); };
    }
  }
})();
</script>
<script>
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.15 });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// ============ تعديل الأزرار حسب حالة المستخدم ============
// لا تحويل تلقائي - المستخدم يشوف الصفحة الرئيسية دائماً
// لكن الأزرار تتغيّر إذا كان مسجّل دخول
document.addEventListener('DOMContentLoaded', async function () {
  try {
    if (typeof tryRestoreSession === 'function') {
      await tryRestoreSession();
    }
    const user = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
    if (!user || !user.role) return; // زائر — اخلي الأزرار الافتراضية

    const dashboardUrl = user.role === 'creator' ? '/creator.html' : '/brand.html';
    const dashKey = user.role === 'creator' ? 'dash_creator' : 'dash_brand';
    const dashLabel = (window.simblI18n)
      ? simblI18n.t(dashKey)
      : (user.role === 'creator' ? 'الانتقال إلى لوحتي ←' : 'الانتقال إلى حملاتي الإعلانية ←');

    // 1) أزرار النافبار — استبدل بزر واحد
    const navActions = document.getElementById('nav-actions');
    if (navActions) {
      navActions.innerHTML = `<a href="${dashboardUrl}" class="btn btn-primary" data-i18n="${dashKey}">${dashLabel}</a>`;
    }

    // 2) أزرار الهيرو — استبدل بزر واحد
    const heroCtas = document.getElementById('hero-ctas');
    if (heroCtas) {
      heroCtas.innerHTML = `<a href="${dashboardUrl}" class="btn btn-primary hero-cta-lg" data-i18n="${dashKey}">${dashLabel}</a>`;
    }
    // أعد تطبيق اللغة على الأزرار الجديدة
    if (window.simblI18n) simblI18n.apply();
  } catch (err) {
    console.error('UI update failed:', err);
  }
});
</script>


<script>
(function(){
  var story=document.getElementById('heroStory'); if(!story) return;
  function $(id){return document.getElementById(id);}
  var P=[[450,96],[330,66],[210,88],[90,58]];
  var ng=$('hsCps'),puffG=$('hsPuffs');
  var nodes=P.map(function(p){
    var c1=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c1.setAttribute('cx',p[0]);c1.setAttribute('cy',p[1]);c1.setAttribute('r',4.5);c1.setAttribute('fill','#E8DFCE');
    ng.appendChild(c1);
    var c2=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c2.setAttribute('cx',p[0]);c2.setAttribute('cy',p[1]);c2.setAttribute('r',0);c2.setAttribute('fill','#E23B2E');
    ng.appendChild(c2);return c2;});
  var puffs=[0,1].map(function(){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('fill','#D8CDB8');c.setAttribute('opacity',0);puffG.appendChild(c);return c;});
  var hop=$('hsHop'),sq=$('hsSq'),glow=$('hsGlow'),prog=$('hsProg'),sh=$('hsShadow');
  var sents=story.querySelectorAll('.hs-s');
  var DROP=380,REST=880,CROUCH=130,FLIGHT=340,HOPW=CROUCH+FLIGHT,
      BACKC=150,BACKF=640;
  var land=[DROP],i;
  for(i=1;i<4;i++) land.push(land[i-1]+REST+HOPW);
  var LAP=land[3]+REST, CYCLE=LAP+BACKC+BACKF;
  function io(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function outC(t){return 1-Math.pow(1-t,3);}
  function inC(t){return t*t*t;}
  function render(t){
    var x=P[0][0],y=P[0][1],rot=0,air=0,landAge=-1,crouchK=0,gy=P[0][1];
    if(t<DROP){
      var kd=inC(t/DROP);
      x=P[0][0]; y=P[0][1]-130*(1-kd); air=1-kd; gy=P[0][1];
    } else if(t<LAP){
      var st=0,j;
      for(j=0;j<4;j++){ if(t>=land[j]) st=j; }
      var restEnd=land[st]+REST;
      if(t<restEnd||st===3){ x=P[st][0]; y=P[st][1]; landAge=t-land[st]; gy=P[st][1]; }
      if(st<3&&t>=restEnd){
        var ht=t-restEnd;
        if(ht<CROUCH){ x=P[st][0]; y=P[st][1]; crouchK=io(ht/CROUCH); rot=8*crouchK; gy=P[st][1]; landAge=-1; }
        else{
          var k=(ht-CROUCH)/FLIGHT, kx=io(k);
          x=P[st][0]+(P[st+1][0]-P[st][0])*kx;
          var yl=P[st][1]+(P[st+1][1]-P[st][1])*kx;
          var arc=4*k*(1-k);
          y=yl-50*arc; air=arc; rot=-360*outC(k); gy=yl; landAge=-1;
        }
      }
    } else {
      var bt=t-LAP;
      if(bt<BACKC){ x=P[3][0];y=P[3][1];crouchK=io(bt/BACKC);rot=-8*crouchK;gy=P[3][1]; }
      else if(bt<BACKC+BACKF){
        var k2=(bt-BACKC)/BACKF, kx2=io(k2);
        x=P[3][0]+(P[0][0]-P[3][0])*kx2;
        var yl2=P[3][1]+(P[0][1]-P[3][1])*kx2;
        var arc2=4*k2*(1-k2);
        y=yl2-100*arc2; air=arc2; rot=360*outC(k2); gy=yl2;
      } else { x=P[0][0];y=P[0][1];landAge=t-LAP-BACKC-BACKF;gy=P[0][1]; }
    }
    var sx=1,sy=1;
    if(crouchK>0){ sx=1+0.20*crouchK; sy=1-0.18*crouchK; }
    else if(air>0){ sx=1-0.12*air; sy=1+0.16*air; }
    if(landAge>=0&&landAge<420){
      var e=Math.exp(-landAge/110), c=Math.cos(landAge/52);
      sy=1-0.26*e*c; sx=1+0.28*e*c;
    } else if(landAge>=420){
      var b=Math.sin((landAge-420)/280);
      sy=1+0.018*b; sx=1-0.012*b;
    }
    hop.setAttribute('transform','translate('+x+','+y+') rotate('+rot+')');
    sq.setAttribute('transform','scale('+sx.toFixed(3)+','+sy.toFixed(3)+')');
    sh.setAttribute('cx',x); sh.setAttribute('cy',gy+5);
    sh.setAttribute('rx',14*(1-0.5*air)); sh.setAttribute('opacity',0.13*(1-0.6*air));
    var pts='450,96';
    if(t<LAP){
      var seg=0;
      for(j=1;j<4;j++){ if(x<=P[j-1][0]&&x>=P[j][0]) seg=j; }
      for(j=1;j<seg;j++) pts+=' '+P[j][0]+','+P[j][1];
      if(seg>0){ var kk=(P[seg-1][0]-x)/(P[seg-1][0]-P[seg][0]);
        pts+=' '+x+','+(P[seg-1][1]+(P[seg][1]-P[seg-1][1])*kk); }
      prog.setAttribute('opacity',1);
    } else {
      pts='450,96 330,66 210,88 90,58';
      prog.setAttribute('opacity',Math.max(0,1-(t-LAP)/(BACKC+BACKF)));
    }
    prog.setAttribute('points',pts);
    nodes.forEach(function(n,j3){
      var on=t>=land[j3]&&t<LAP+(BACKC+BACKF)*0.5;
      var r=on?4:0, dt=t-land[j3];
      if(on&&dt<200) r=4+2.2*Math.sin(Math.PI*dt/200);
      n.setAttribute('r',Math.max(0,r));});
    puffs.forEach(function(c2,pi){
      var best=-1;
      for(j=0;j<4;j++){ var a=t-land[j]; if(a>=0&&a<340) best=j; }
      if(best>=0){ var a2=(t-land[best])/340;
        c2.setAttribute('cx',P[best][0]+(pi?15:-15)*(0.4+a2));
        c2.setAttribute('cy',P[best][1]+2-6*a2);
        c2.setAttribute('r',3+7*a2);
        c2.setAttribute('opacity',0.4*(1-a2));
      } else c2.setAttribute('opacity',0);
    });
    sents.forEach(function(el,j4){
      var s0=land[j4]+110, s1=(j4<3?land[j4]+REST+60:LAP+60);
      var op=0,ty=10;
      if(t>=s0&&t<s1){
        var dt2=t-s0; op=Math.min(1,dt2/220); ty=10*(1-Math.min(1,dt2/220));
        var out=s1-t; if(out<200) op=Math.min(op,out/200);
      }
      el.style.opacity=op;
      el.style.transform='translateY('+ty+'px)';
    });
    glow.style.opacity=0.75+0.25*Math.sin(t/650);
  }
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ render(LAP-100); return; }
  var S=null;
  function loop(now){
    if(S===null)S=now;
    var raw=now-S, t;
    if(raw<CYCLE) t=raw;
    else t=DROP+((raw-DROP)%(CYCLE-DROP));
    render(t); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
