 [[-118,-30,'#F7DE9B'],[92,-38,'#BFE3C9'],[-16,34,'#F6C9C2']].forEach(function(o){

 }

 var links=pairs.map(function(pr,k){

 });

 /* الأشخاص */
 var gP=E('g',null,gA);
 pos.forEach(function(p,i){

  ppl.push({g:g,col:col});
 });

 /* فقاعات كلام */
 var gBub=E('g',null,gA), bubs=[];
 [1,4,7,10,13].forEach(function(i,k){
  var p=pos[i];
  var bx=p[0]+(p[0]<CX?-26:26), by=p[1]-54;
  var g=E('g',{opacity:'0'},gBub);
  E('rect',{x:bx-24,y:by-14,width:48,height:28,rx:9,fill:'#fff',stroke:'#EFE6E1','stroke-width':1.2},g);

 });

 var gPart=E('g',null,gB), parts=[];

  }
 });

 var solo=E('g',{opacity:'0'},gB);
 E('ellipse',{cx:450,cy:396,rx:118,ry:11,fill:'#F5EFEB'},solo);

 E('path',{d:'M 619 352 C 600 340 598 316 614 306 C 624 318 624 340 619 352 Z',fill:'#0DA64F',opacity:'.85'},solo);
 E('path',{d:'M 619 352 C 638 342 642 320 628 310 C 618 322 616 342 619 352 Z',fill:'#0DA64F',opacity:'.6'},solo);

  '<circle cx="0" cy="-3" r="4.2"/><path d="M -7 7 a 7 7 0 0 1 14 0"/>',

 ];
 var CT=[[262,128],[262,252],[638,128],[638,252]];

  var g=E('g',{opacity:'0'},gB), col=LC[[0,4,3,2][k]];
  E('rect',{x:-46,y:-28,width:92,height:56,rx:14,fill:'#fff',stroke:'#EFE6E1','stroke-width':1.3},g);

 var LOOP=11.0, t0=null, running=false, st=-1;
 function setPhase(k){ if(k===st)return; st=k; cap.className='mtcap p'+k; }

 function frame(now){
  if(!running) return;
  if(t0===null) t0=now;
  var t=((now-t0)/1000)%LOOP;

  /* المشهد الأول */
  var aIn=ease(seg(t,0.15,1.0)), aOut=1-ease(seg(t,3.55,4.30));
  gA.setAttribute('opacity',(aIn*aOut).toFixed(3));
  var aSc=lerp(1,0.72,ease(seg(t,3.55,4.30)));
  gA.setAttribute('transform','translate('+HUB[0]+','+HUB[1]+') scale('+aSc.toFixed(3)+') translate('+(-HUB[0])+','+(-HUB[1])+')');

  ppl.forEach(function(o,i){

  });

  var chaos=ease(seg(t,1.0,1.7))*(1-ease(seg(t,3.15,3.60)));
  links.forEach(function(o,i){
   o.ln.setAttribute('opacity',(chaos*0.9).toFixed(3));

  bubs.forEach(function(o){

   o.g.setAttribute('transform','translate(0,'+(-6*v).toFixed(1)+')');
  });

  /* الذوبان */
  var dz=seg(t,3.60,4.60);

   o.el.setAttribute('opacity',(Math.sin(cl(k,0,1)*Math.PI)*0.95).toFixed(3));

  var ww=win.offsetWidth||280, wh=win.offsetHeight||190;
  var cIn=ease(seg(t,5.60,5.95)), cOut=1-ease(seg(t,9.6,10.1));
  var mv=out3(seg(t,5.80,6.75));
  var press=(t>6.85&&t<7.05)?2:0;
  cur.style.opacity=(cIn*cOut).toFixed(3);
  cur.style.transform='translate('+(lerp(ww+30,ww*0.63,mv)+press)+'px,'+(lerp(wh+58,wh-30,mv)+press)+'px)';
  if(t>6.95&&t<10.2) btn.classList.add('done'); else btn.classList.remove('done');

  /* انفجار الكونفيتي والحلقة */
  var bk=seg(t,6.95,8.5);
  if(bk>0&&bk<1){
   var el2=(t-6.95);
   conf.forEach(function(o,i){
    var x=450+Math.cos(o.a)*o.v*el2, y=196+Math.sin(o.a)*o.v*el2+190*el2*el2;

    o.el.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+(o.sp*el2).toFixed(1)+')');

  ring.setAttribute('r',(10+120*out3(rk)).toFixed(1));

  /* البطاقات */
  cards.forEach(function(o,k){
   var q=seg(t,7.25+o.ph,8.25+o.ph), e=out5(q);

   o.g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+sc.toFixed(3)+')');
  });
