<style>
:root {
  --cream: #ffffff;
  --cream-darker: #F3EEE4;
  --ink: #0F1420;
  --ink-soft: #2C3548;
  --ink-muted: #8A93A6;
  --ink-faint: #AAB2C0;
  --accent: #E23B2E;
  --accent-soft: #F0A79E;
  --accent-ink: #7E2119;
  --olive: #5b5b5b;
  --gold: #D4A24C;
  --line: rgba(15, 20, 32, 0.08);
  --line-strong: rgba(15, 20, 32, 0.16);
  --font-display: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-serif: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}
.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }
.nav {
  padding: 32px 0;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  z-index: 50;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; }
.logo {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-decoration: none;
  color: var(--ink);
}
.logo-eye { width: 72px; height: 72px; display: block; flex-shrink: 0; }
.logo-pupil {
  transform-box: fill-box;
  transform-origin: center;
  animation: logoLook 6s ease-in-out infinite;
}
@keyframes logoLook {
  0%, 12% { transform: translate(0, 0); }
  24% { transform: translate(6px, 0); }
  40% { transform: translate(-6px, 0); }
  52% { transform: translate(0, 2px); }
  64% { transform: translate(0, 0); }
  72% { transform: translate(0, 0) scaleY(0.15); }
  76% { transform: translate(0, 0) scaleY(1); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) { .logo-pupil { animation: none; } }
.logo-mark {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  position: relative;
}
.logo-mark::after{content:none}
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-links a:not(.btn) {
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
  transition: color 0.2s;
}
.nav-links a:not(.btn):hover { color: var(--accent); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #262626; transform: translateY(-1px); }
.btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid rgba(15, 20, 32, 0.28); }
.btn-ghost:hover { border-color: var(--ink); }
.lang-toggle { padding: 10px 16px; font-weight: 600; min-width: 54px; justify-content: center; }
.hero {
  min-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 0 56px;
  position: relative;
}
.hero .container { width: 100%; }
.hero-grid { width: min(760px, 100%); margin: 0 auto; text-align: center; }
.hero-story{position:relative;height:150px;margin-bottom:44px}
.hs-words{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center}
.hs-w{position:absolute;font-family:var(--font-body);font-size:clamp(26px,4.4vw,36px);font-weight:800;color:var(--ink);opacity:0;white-space:nowrap;will-change:transform,opacity}
.hs-w.future{color:var(--accent)}
.hs-line{position:absolute;top:74px;left:50%;transform:translateX(-50%);width:min(440px,86vw)}
.hs-line svg{display:block;width:100%;height:auto}
.hs-brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;will-change:transform,opacity}
.hs-brand .bm{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,5.5vw,48px);color:var(--ink);letter-spacing:-.01em;direction:ltr}
.hs-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,88vw);height:210px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,59,46,.22),rgba(226,59,46,.05) 62%,transparent 100%);opacity:0;pointer-events:none}

.hero-lines{max-width:520px;margin:0 auto 30px}
.hero-lines .hl{display:block;font-size:clamp(16px,2.2vw,19px);color:var(--ink-soft);font-weight:500;line-height:2.05}
.hero-lines .hl.strong{color:var(--ink);font-weight:700}
.cta-flow{position:relative;width:min(760px,100%);margin:0 auto;height:220px}
.cta-flow svg.flow{position:absolute;inset:0;width:100%;height:100%}
.cta-flow .fbtn{position:absolute;top:108px;width:210px;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:100px;font-weight:800;font-size:15.5px;text-decoration:none;transition:transform .25s ease}
.cta-flow .fbtn .leaf{position:absolute;top:-15px;width:28px;pointer-events:none}
.cta-flow .fbtn.primary{left:calc(50% + 22px);background:linear-gradient(135deg,#EE5A44,#B4271C);color:#fff;box-shadow:0 16px 32px -16px rgba(226,59,46,.65);transform:rotate(-4deg)}
.cta-flow .fbtn.primary .leaf{right:-4px;transform:rotate(-30deg)}
.cta-flow .fbtn.ghost{right:calc(50% + 22px);background:#fff;border:1.6px solid rgba(226,59,46,.34);color:var(--ink);transform:rotate(4deg)}
.cta-flow .fbtn.ghost .leaf{left:-4px;transform:rotate(30deg) scaleX(-1)}
.cta-flow .fbtn:hover{transform:rotate(0deg) translateY(-3px)}
@media(max-width:840px){
  .cta-flow{height:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
  .cta-flow svg.flow{display:none}
  .cta-flow .fbtn{position:static;transform:none;width:min(320px,86vw)}
  .cta-flow .fbtn .leaf{display:none}
}

.hero-desc {
  font-size: 16px;
  color: var(--ink-soft);
  font-weight: 400;
  max-width: 440px;
  margin: 0 auto 36px;
  line-height: 1.7;
}
/* legacy */
.hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.hero-cta-lg { padding: 17px 30px; font-size: 15px; }
.hero-steps {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 56px;
  padding-top: 36px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.hstep {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  animation: stepFlow 3s ease-in-out infinite;
}
.hstep .ic {
  width: 34px; height: 34px;
  flex: none; border-radius: 50%;
  background: rgba(226,59,46, 0.12);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  animation: stepIc 3s ease-in-out infinite;
}
.hstep .ic svg { width: 18px; height: 18px; display: block; }
.hstep .t { font-size: 14px; font-weight: 600; color: var(--ink); }
.hstep:nth-child(2), .hstep:nth-child(2) .ic { animation-delay: 1s; }
.hstep:nth-child(3), .hstep:nth-child(3) .ic { animation-delay: 2s; }
@keyframes stepFlow {
  0%, 25%, 100% { border-color: var(--line); box-shadow: none; transform: translateY(0); }
  8%, 17% { border-color: var(--accent); box-shadow: 0 8px 20px rgba(226,59,46, 0.18); transform: translateY(-4px); }
}
@keyframes stepIc {
  0%, 25%, 100% { background: rgba(226,59,46, 0.12); color: var(--accent); }
  8%, 17% { background: var(--accent); color: #fff; }
}
.footer { padding: 56px 0 40px; border-top: 1px solid var(--line); }
.footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 24px; }
.footer-info { display: flex; align-items: center; gap: 14px; color: var(--ink-muted); font-size: 13px; }
.footer-info .logo-eye { width: 28px; height: 28px; }
.footer-links { display: flex; gap: 28px; }
.footer-links a { color: var(--ink-muted); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.footer-links a:hover { color: var(--ink); }
@media (max-width: 980px) {
  .nav-links a:not(.btn) { display: none; }
  .hero-steps { gap: 24px; }
  .hero { padding: 32px 0 48px; }
}
@media (max-width: 600px) {
  .container { padding: 0 20px; }
  .logo-eye { width: 52px; height: 52px; }
  .logo-mark { font-size: 13px; }
  .hero-steps { gap: 12px; }
}
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s, transform 0.8s; }
.reveal.visible { opacity: 1; transform: translateY(0); }
</style>

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);
  // أجهزة الجوال فقط (الكمبيوتر ما يحتاج)
  if (!isIOS && !isAndroid) return;

  var deferredPrompt = null;

  // أندرويد/كروم: نلتقط حدث التثبيت التلقائي

    e.preventDefault();

    var eye = '<svg viewBox="0 0 200 200" style="width:38px;height:38px;flex-shrink:0;" aria-hidden="true"><g><path d="M112 62 C106 40 90 36 80 22" fill="none" stroke="#EAF7F0" stroke-width="12" stroke-linecap="round"/><path d="M96 40 C86 28 88 14 102 12 C104 27 103 37 96 40Z" fill="#EAF7F0"/><path d="M89.6 61.2L90.9 63.8L92.0 66.4L92.9 69.0L93.8 71.6L94.5 74.3L95.1 77.0L95.6 79.7L96.0 82.4L96.3 85.1L96.6 87.9L96.7 90.7L96.7 93.6L96.6 96.5L96.5 99.4L96.2 102.4L95.9 105.4L95.5 108.4L95.0 111.5L94.4 114.6L93.8 117.7L93.0 120.8L92.2 124.0L91.4 127.2L90.5 130.4L89.5 133.6L88.5 136.9L87.4 140.2L86.3 143.5L85.2 146.8L84.0 150.1L82.8 153.4L81.7 156.8L80.5 160.2L79.3 163.7L78.2 167.2L77.2 170.8L76.3 174.6L75.6 178.5L75.3 182.9L78.0 190.0L78.0 190.0L85.4 191.6L89.9 190.4L93.9 188.6L97.6 186.4L101.0 184.0L104.4 181.4L107.5 178.6L110.6 175.6L113.5 172.5L116.4 169.3L119.1 165.9L121.7 162.5L124.2 158.9L126.5 155.2L128.8 151.4L130.9 147.6L133.0 143.6L134.8 139.6L136.6 135.5L138.2 131.3L139.7 127.1L141.1 122.7L142.3 118.4L143.3 113.9L144.2 109.4L145.0 104.9L145.5 100.2L145.9 95.6L146.1 90.9L146.1 86.2L145.9 81.5L145.5 76.7L144.9 71.9L144.0 67.1L143.0 62.4L141.7 57.6L140.2 52.8L138.5 48.1L136.5 43.5A25.0 25.0 0 0 0 89.6 61.2Z" fill="#ffffff"/></g></svg>';

    if (type === 'android') {
      banner.innerHTML = eye +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;font-size:15px;margin-bottom:2px;">ثبّت Flfluencer على جوالك</div>' +
          '<div style="font-size:12px;opacity:0.8;line-height:1.5;">وصول أسرع وإشعارات فورية</div>' +
        '</div>' +
        '<button id="simbl-install-go" style="background:#E23B2E;color:#fff;border:none;padding:10px 20px;border-radius:100px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;">تثبيت</button>' +
        '<button id="simbl-install-x" style="background:transparent;color:#fff;border:none;padding:4px 6px;font-size:22px;cursor:pointer;opacity:0.6;line-height:1;flex-shrink:0;" aria-label="إغلاق">&times;</button>';
      document.body.appendChild(banner);
      requestAnimationFrame(function(){ banner.style.opacity = '1'; banner.style.transform = 'translateY(0)'; });

      document.getElementById('simbl-install-go').onclick = async function() {
        if (!deferredPrompt) { dismiss(banner); return; }
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) {}
        deferredPrompt = null;
        dismiss(banner);
      };
      document.getElementById('simbl-install-x').onclick = function(){ dismiss(banner); };
    } else {
      // آيفون: تعليمات يدوية
      banner.innerHTML = eye +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;font-size:15px;margin-bottom:2px;">أضِف Flfluencer لشاشتك</div>' +
          '<div style="font-size:12px;opacity:0.85;line-height:1.6;">اضغط زر المشاركة <span style="display:inline-block;border:1px solid rgba(255,255,255,0.5);border-radius:5px;padding:0 5px;">&#8593;</span> بالأسفل، ثم اختر <strong>«إضافة إلى الشاشة الرئيسية»</strong></div>' +
        '</div>' +
        '<button id="simbl-install-x" style="background:transparent;color:#fff;border:none;padding:4px 6px;font-size:22px;cursor:pointer;opacity:0.6;line-height:1;flex-shrink:0;" aria-label="إغلاق">&times;</button>';
      document.body.appendChild(banner);
      requestAnimationFrame(function(){ banner.style.opacity = '1'; banner.style.transform = 'translateY(0)'; });

    }
  }
})();

<script>
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.15 });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// ============ تعديل الأزرار حسب حالة المستخدم ============
// لا تحويل تلقائي - المستخدم يشوف الصفحة الرئيسية دائماً
// لكن الأزرار تتغيّر إذا كان مسجّل دخول
document.addEventListener('DOMContentLoaded', async function () {
  try {
    if (typeof tryRestoreSession === 'function') {
      await tryRestoreSession();
    }
    const user = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
    if (!user || !user.role) return; // زائر — اخلي الأزرار الافتراضية

    const dashboardUrl = user.role === 'creator' ? '/creator.html' : '/brand.html';
    const dashKey = user.role === 'creator' ? 'dash_creator' : 'dash_brand';
    const dashLabel = (window.simblI18n)
      ? simblI18n.t(dashKey)
      : (user.role === 'creator' ? 'الانتقال إلى لوحتي ←' : 'الانتقال إلى حملاتي الإعلانية ←');

    // 1) أزرار النافبار — استبدل بزر واحد
    const navActions = document.getElementById('nav-actions');
    if (navActions) {
      navActions.innerHTML = `<a href="${dashboardUrl}" class="btn btn-primary" data-i18n="${dashKey}">${dashLabel}</a>`;
    }

    // 2) أزرار الهيرو — استبدل بزر واحد
    const heroCtas = document.getElementById('hero-ctas');
    if (heroCtas) {
      heroCtas.innerHTML = `<a href="${dashboardUrl}" class="btn btn-primary hero-cta-lg" data-i18n="${dashKey}">${dashLabel}</a>`;
    }
    // أعد تطبيق اللغة على الأزرار الجديدة
    if (window.simblI18n) simblI18n.apply();
  } catch (err) {
    console.error('UI update failed:', err);
  }
});
</script>


<script>
(function(){
  var flow=document.getElementById('ctaFlow'); if(!flow) return;
  function $(id){return document.getElementById(id);}
  var cR=$('fcR'), cL=$('fcL'), LR=cR.getTotalLength(), LL=cL.getTotalLength();
  [ [cR,LR],[cL,LL] ].forEach(function(a){
    a[0].style.strokeDasharray=a[1]; a[0].style.strokeDashoffset=a[1];
  });
  var easeOut=function(t){return 1-Math.pow(1-t,3);};
  var T_E=[60,240], T_B=[300,620], STOP=1500;
  function pop(el,t0,t,rot){
    var dt=t-t0,sc=1;
    if(dt>=0&&dt<260) sc=1+0.05*Math.sin(Math.PI*dt/260);
    el.style.transform='rotate('+rot+'deg) scale('+sc.toFixed(3)+')';
  }
  function render(t){
    var kE=t<T_E[0]?0:Math.min(1,easeOut((t-T_E[0])/(T_E[1]-T_E[0])));
    $('fpE').setAttribute('y2',8+38*kE);
    $('fdE').setAttribute('cx',380);$('fdE').setAttribute('cy',8+38*kE);
    $('fdE').setAttribute('opacity',t>T_E[0]&&t<T_E[1]?1:0);
    $('fjn').setAttribute('r',t>T_E[1]-40?4.5:0);
    var kB=t<T_B[0]?0:Math.min(1,easeOut((t-T_B[0])/(T_B[1]-T_B[0])));
    cR.style.strokeDashoffset=LR*(1-kB);
    cL.style.strokeDashoffset=LL*(1-kB);
    var pr=cR.getPointAtLength(LR*kB), pl=cL.getPointAtLength(LL*kB);
    $('fdR').setAttribute('cx',pr.x);$('fdR').setAttribute('cy',pr.y);
    $('fdL').setAttribute('cx',pl.x);$('fdL').setAttribute('cy',pl.y);
    $('fdR').setAttribute('opacity',kB>0&&kB<1?1:0);
    $('fdL').setAttribute('opacity',kB>0&&kB<1?1:0);
    $('fnR').setAttribute('r',kB>=1?4.5:0);
    $('fnL').setAttribute('r',kB>=1?4.5:0);
    pop($('fbR'),T_B[1],t,-4); pop($('fbL'),T_B[1],t,4);
  }
  function finish(){
    render(STOP);
    $('fbR').style.transform=''; $('fbL').style.transform='';
  }
  var small=window.matchMedia&&window.matchMedia('(max-width: 840px)').matches;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(small) return;
  if(reduced){ finish(); return; }
  var S=null;
  function loop(now){
    if(S===null)S=now;
    var t=now-S;
    if(t>=STOP){ finish(); return; }
    render(t); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
(function(){
  var story=document.getElementById('heroStory'); if(!story) return;
  var P=[[410,40],[300,16],[190,34],[80,10]];
  var cps=document.getElementById('hsCps');
  var items=P.map(function(p){
    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#E5DCC9"/><circle class="on" cx="'+p[0]+'" cy="'+p[1]+'" r="0" fill="#E23B2E"/>';
    cps.appendChild(g); return g;});
  var prog=document.getElementById('hsProg'),dot=document.getElementById('hsDot'),
      ring=document.getElementById('hsRing'),brand=document.getElementById('hsBrand'),
      glow=document.getElementById('hsGlow'),words=story.querySelectorAll('.hs-w'),
      wordbox=story.querySelector('.hs-words'),linewrap=story.querySelector('.hs-line');
  var HOP=240,PAUSE=430,SHOW0=520,T=[],t0=SHOW0,i;
  for(i=0;i<3;i++){T.push([t0,t0+HOP,i,i+1]);t0+=HOP+PAUSE;}
  var LAST=T[2][1],HOLD=760,FADE=340,BRAND=1250,CYCLE=LAST+HOLD+FADE+BRAND+150;
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function back(t){var s=2.04;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);}
  function lerp(a,b,k){return a+(b-a)*k;}
  function pos(t){
    var seg=0,j;
    for(j=0;j<T.length;j++){var h=T[j];
      if(t>=h[1]){seg=h[3];}
      else if(t>=h[0]){var kk=easeOut((t-h[0])/(h[1]-h[0]));
        return [lerp(P[h[2]][0],P[h[3]][0],kk),lerp(P[h[2]][1],P[h[3]][1],kk),h[2]+kk];}
      else break;}
    return [P[seg][0],P[seg][1],seg];
  }
  function render(t){
    t%=CYCLE;
    var fadeStart=LAST+HOLD;
    var lineOp=t<fadeStart?1:Math.max(0,1-(t-fadeStart)/FADE);
    linewrap.style.opacity=lineOp; wordbox.style.opacity=lineOp;
    var p=pos(Math.min(t,fadeStart)),x=p[0],y=p[1],fi=p[2];
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);
    var pts='410,40',j;
    for(j=1;j<4;j++){ if(fi>=j) pts+=' '+P[j][0]+','+P[j][1]; }
    if(fi%1>0) pts+=' '+x+','+y;
    prog.setAttribute('points',pts);
    items.forEach(function(g,j2){
      var arrive=j2===0?0:T[j2-1][1];
      var on=t>=arrive&&t<fadeStart+FADE;
      var dt=t-arrive,r=on?5:0;
      if(on&&dt<170) r=5+2.4*Math.sin(Math.PI*dt/170);
      g.querySelector('.on').setAttribute('r',Math.max(0,r));});
    words.forEach(function(w,j3){
      var arrive=j3===0?60:T[j3-1][1];
      var leave=j3<3?T[j3][1]:fadeStart;
      var op=0,sc=1;
      if(t>=arrive&&t<leave){
        var dt2=t-arrive;
        op=Math.min(1,dt2/140);
        sc=dt2<260?back(Math.min(1,dt2/260)):1;
        var out=leave-t; if(out<120) op=Math.min(op,out/120);
      }
      w.style.opacity=op;
      w.style.transform='scale('+(0.86+0.14*sc)+')';
    });
    var dt3=t-LAST;
    if(dt3>0&&dt3<560&&t<fadeStart+FADE){ring.setAttribute('opacity',0.5*(1-dt3/560)*lineOp);ring.setAttribute('r',8+14*(dt3/560));}
    else ring.setAttribute('opacity',0);
    var bs=fadeStart+FADE*0.55;
    if(t>=bs){
      var bt=t-bs,op2=Math.min(1,bt/200),sc2=bt<420?back(Math.min(1,bt/420)):1;
      brand.style.opacity=op2;
      brand.style.transform='scale('+(0.8+0.2*sc2)+')';
      var g2=Math.min(1,bt/300);
      glow.style.opacity=(bt<900?g2*0.9:Math.max(0,0.9-(bt-900)/500));
    } else { brand.style.opacity=0; glow.style.opacity=0; }
  }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    render(LAST+HOLD-1);
    return;
  }
  var S=null;
  function loop(now){ if(S===null)S=now; render(now-S); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
