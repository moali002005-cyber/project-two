<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>الدفع الآجل للشركات — Flfluencer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#FBF8F6; --card:#FFFFFF; --ink:#16110F; --dim:#8A807B;
    --line:#EFE8E4; --line2:#E2D9D4; --accent:#E23B2E; --accent-soft:#FDF1F0;
    --good:#1D8F6B; --good-soft:#E8F5F0; --warn:#9A4B06; --warn-soft:#FBF0E4;
    --bad:#C0392B; --bad-soft:#FDECEA; --info:#2B5C9E; --info-soft:#EAF1FA;
    --shadow:0 1px 2px rgba(22,17,15,.05), 0 8px 26px rgba(22,17,15,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.7;padding:24px 16px 64px}
  .wrap{max-width:1240px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}
  .mast{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
  h1{font-size:clamp(21px,4.4vw,27px);margin:0;font-weight:700}
  .sub{font-size:13px;color:var(--dim);margin:4px 0 0;max-width:720px}
  .btn2{font-family:inherit;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;text-decoration:none}
  .btn2:hover{border-color:var(--ink)}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .sum > div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
  .sum .v{font-size:22px;font-weight:700}
  .sum .l{font-size:12px;color:var(--dim)}
  .pipe{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pipe button{font-family:inherit;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#4a423e;display:inline-flex;gap:6px;align-items:center}
  .pipe button b{font-variant-numeric:tabular-nums;background:#F3F1EF;border-radius:99px;padding:0 7px;font-size:11.5px}
  .pipe button.on{border-color:var(--ink);color:var(--ink)}
  .pipe button.hot b{background:var(--accent);color:#fff}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .tools input{flex:1 1 240px;font-family:inherit;font-size:14px;padding:10px 13px;border:1px solid var(--line2);border-radius:10px;background:#fff}
  .tools input:focus,.ed input:focus,.ed select:focus,.ed textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .sheet-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13.5px}
  th,td{border-bottom:1px solid var(--line);padding:10px 11px;text-align:right;vertical-align:middle}
  thead th{background:#F3F1EF;font-size:12px;color:#5c534f;font-weight:700;position:sticky;top:0;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#FFFBF7}
  .co b{display:block}
  .co small{color:var(--dim);font-size:12px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
  td .num{white-space:nowrap}
  .dash{color:#C9C0BC}
  .st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;display:inline-block}
  .st.s-new{background:var(--accent-soft);color:var(--accent)}
  .st.s-wait{background:var(--warn-soft);color:var(--warn)}
  .st.s-info{background:var(--info-soft);color:var(--info)}
  .st.s-good{background:var(--good-soft);color:var(--good)}
  .st.s-bad{background:var(--bad-soft);color:var(--bad)}
  .st.s-off{background:#F3F1EF;color:var(--dim)}
  .meth{font-size:11px;color:var(--dim);display:block}
  .pay{font-size:11.5px;font-weight:700;white-space:nowrap}
  .pay.paid{color:var(--good)} .pay.overdue{color:var(--bad)} .pay.unpaid{color:var(--warn)}
  .empty,.err{background:var(--card);border:1px dashed var(--line2);border-radius:13px;padding:28px 20px;text-align:center;color:var(--dim)}
  /* editor */
  .ov{position:fixed;inset:0;background:rgba(22,17,15,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:50}
  .ov.on{display:flex}
  .ed{background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px 20px 18px}
  .ed-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .ed-h h2{margin:0;font-size:19px}
  .ed-h .x{font-family:inherit;border:0;background:#F3F1EF;border-radius:9px;width:34px;height:34px;font-size:18px;cursor:pointer}
  .next{background:#FFFBF2;border:1px solid #F2E2C4;border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .next .t{font-size:12px;color:var(--warn);font-weight:700;margin-bottom:4px}
  .next p{margin:0 0 8px;font-size:13.5px}
  .next .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .next .row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);flex:1 1 180px}
  .go{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;background:var(--ink);color:#fff}
  .go.green{background:var(--good)}
  .go:disabled{opacity:.5;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);font-weight:600}
  .grid .full{grid-column:1/-1}
  .ed input,.ed select,.ed textarea{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);width:100%}
  .ed textarea{min-height:64px;resize:vertical}
  .sec{font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 0 8px;padding-top:10px;border-top:1px dashed var(--line2)}
  .ro{font-size:13px;background:#F8F5F3;border-radius:9px;padding:8px 11px;color:#4a423e}
  .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .hist{font-size:12.5px;color:#5c534f;margin:0;padding:0;list-style:none}
  .hist li{padding:4px 0;border-bottom:1px solid var(--line)}
  .hist li span{color:var(--dim)}
  .ghost{font-family:inherit;cursor:pointer;background:none;border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--bad)}
  #toast{position:fixed;inset-inline:16px;bottom:18px;max-width:420px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;display:none;z-index:99;text-align:center}
  @media (max-width:640px){.sum{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">جارٍ التحميل…</div></div>

<div class="ov" id="ov" onclick="if(event.target===this)closeEd()">
  <div class="ed" id="ed"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://chpzecgpylxqsutjydkb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNocHplY2dweWx4cXN1dGp5ZGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyODgxNzQsImV4cCI6MjA5OTg2NDE3NH0.q4wmWKtJ5IPx8AgzMkp3SuFLZL9F10qKc3qiX5LB7kI';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ST = [
  ['new','طلب دفع آجل جديد','s-new'],
  ['quote_sent','تم إرسال عرض السعر','s-info'],
  ['awaiting_po','بانتظار PO','s-wait'],
  ['awaiting_agreement','بانتظار قبول الاتفاقية','s-wait'],
  ['awaiting_nafith','بانتظار سند نافذ','s-wait'],
  ['nafith_accepted','تم قبول السند ✅','s-good'],
  ['invoiced','تم إصدار الفاتورة','s-info'],
  ['active','الحملة فعّالة','s-good'],
  ['due_soon','مستحق قريبًا','s-wait'],
  ['overdue','متأخر عن السداد ⚠️','s-bad'],
  ['paid','مدفوع ✅','s-good'],
  ['cancelled','ملغي','s-off']
];
const STL = Object.fromEntries(ST.map(x => [x[0], x[1]]));
const STC = Object.fromEntries(ST.map(x => [x[0], x[2]]));
const TERMS = { net15:'Net 15', net30:'Net 30', net60:'Net 60' };
const PAY = { unpaid:'غير مسدّد', paid:'مسدّد', overdue:'متأخر' };
const HOT = ['new','nafith_accepted','overdue','awaiting_nafith'];  // حالات تنتظر إجراء منك
let ROWS = [], FILTER = '', Q = '', CUR = null, BUSY = false;

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(window.__t); window.__t=setTimeout(()=>t.style.display='none',2600); }
function sar(v){ return v == null || v === '' ? '' : Number(v).toLocaleString('en-US', {maximumFractionDigits:2}); }
function fmtD(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?String(s):d.toLocaleDateString('en-GB',{timeZone:'Asia/Riyadh'}); }
function periodAr(p){ return p==='yearly' ? 'سنوي' : 'شهري'; }
function whatFor(r){ return r.campaign_id ? esc(r.campaign_title||'حملة')+'<span class="meth">'+(r.deals||0)+' صفقة</span>' : esc(r.plan_name||r.plan_code||'—')+'<span class="meth">باقة · '+periodAr(r.period)+'</span>'; }
function stChip(s){ return '<span class="st '+(STC[s]||'s-off')+'">'+esc(STL[s]||s)+'</span>'; }
function match(r, q){
  if (!q) return true;
  return [r.ref, r.campaign_title, r.company_name, r.cr_number, r.finance_name, r.finance_email, r.po_number, r.nafith_number, r.invoice_number, r.brand_email]
    .some(v => String(v||'').toLowerCase().includes(q));
}

function render(){
  const cnt = {}; ROWS.forEach(r => cnt[r.status] = (cnt[r.status]||0) + 1);
  const live = ROWS.filter(r => r.status !== 'cancelled');
  const receivable = live.filter(r => ['invoiced','active','due_soon','overdue'].includes(r.status) && r.payment_status !== 'paid')
                         .reduce((a,r) => a + Number(r.contract_value||0), 0);
  const overdueAmt = live.filter(r => r.status==='overdue').reduce((a,r) => a + Number(r.contract_value||0), 0);
  const paidAmt = live.filter(r => r.payment_status==='paid').reduce((a,r) => a + Number(r.contract_value||0), 0);
  const needAct = live.filter(r => HOT.includes(r.status)).length;
  const pill = (k,l) => '<button class="'+(FILTER===k?'on ':'')+(HOT.includes(k)&&cnt[k]?'hot':'')+'" onclick="setF(\''+k+'\')">'+esc(l)+' <b>'+(k?(cnt[k]||0):ROWS.length)+'</b></button>';
  $('#app').innerHTML =
    '<div class="mast"><div><h1>الدفع الآجل والتحويل البنكي</h1><p class="sub">طلبات الشركات عند دفع الحملة (بعد اعتماد أسماء المعلنين): عرض سعر ← PO عند الحاجة ← اتفاقية الخدمة ← سند نافذ ← الفاتورة ← انطلاق الحملة ← السداد. اضغط أي طلب لفتحه وتحريكه للخطوة التالية — الشركة يوصلها إشعار مع كل تغيير.</p></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn2" href="https://nafith.sa" target="_blank" rel="noopener">منصة نافذ ↗</a><button class="btn2" onclick="load()">↻ تحديث</button><a class="btn2" href="/admin.html">لوحة الإدارة</a></div></div>'
    + '<div class="sum">'
    + '<div><div class="v num" style="color:var(--accent)">'+needAct+'</div><div class="l">تنتظر إجراء منك</div></div>'
    + '<div><div class="v"><span class="num">'+sar(receivable)+'</span> <small style="font-size:12px">ر.س</small></div><div class="l">مستحقات مفوترة غير مسدّدة</div></div>'
    + '<div><div class="v" style="color:var(--bad)"><span class="num">'+sar(overdueAmt)+'</span> <small style="font-size:12px">ر.س</small></div><div class="l">متأخر عن السداد</div></div>'
    + '<div><div class="v" style="color:var(--good)"><span class="num">'+sar(paidAmt)+'</span> <small style="font-size:12px">ر.س</small></div><div class="l">محصّل</div></div>'
    + '</div>'
    + '<div class="pipe">'+pill('','الكل')+ST.map(x => pill(x[0], x[1])).join('')+'</div>'
    + '<div class="tools"><input id="q" placeholder="بحث بالشركة أو السجل أو رقم PO / نافذ / الفاتورة…" value="'+esc(Q)+'" oninput="Q=this.value;renderTable()"></div>'
    + '<div id="tbl"></div>';
  renderTable();
}
function renderTable(){
  const q = Q.trim().toLowerCase();
  const rows = ROWS.filter(r => (!FILTER || r.status===FILTER) && match(r, q));
  const box = $('#tbl'); if (!box) return;
  if (!rows.length) { box.innerHTML = '<div class="empty">'+(ROWS.length?'لا توجد طلبات بهذي الحالة.':'ما وصل أي طلب دفع آجل أو تحويل بنكي للحين. أول ما تختاره شركة عند دفع حملتها يظهر هنا ويوصلك إشعار.')+'</div>'; return; }
  box.innerHTML = '<div class="sheet-wrap"><table><thead><tr>'
    + '<th>الطلب</th><th>الشركة</th><th>السجل التجاري</th><th>مسؤول المالية</th><th>الحملة</th><th>قيمة العقد</th><th>الشروط</th><th>رقم PO</th><th>سند نافذ</th><th>الفاتورة</th><th>الاستحقاق</th><th>السداد</th><th>الحالة</th>'
    + '</tr></thead><tbody>'
    + rows.map(r => '<tr onclick="openEd(\''+r.id+'\')">'
      + '<td><span class="mono">'+esc(r.ref)+'</span><span class="meth">'+(r.method==='bank_transfer'?'🏦 تحويل بنكي':'💼 دفع آجل')+' · '+fmtD(r.created_at)+'</span></td>'
      + '<td class="co"><b>'+esc(r.company_name)+'</b><small>'+esc(r.brand_email||'')+'</small></td>'
      + '<td>'+(r.cr_number?'<span class="mono">'+esc(r.cr_number)+'</span>':'<span class="dash">—</span>')+'</td>'
      + '<td class="co"><b style="font-weight:600">'+esc(r.finance_name||'—')+'</b><small class="mono">'+esc(r.finance_email||'')+'</small></td>'
      + '<td>'+whatFor(r)+'</td>'
      + '<td>'+(r.contract_value!=null?'<span class="num">'+sar(r.contract_value)+'</span> ر.س':'<span class="dash">—</span>')+'</td>'
      + '<td>'+(r.method==='bank_transfer'?'<span class="dash">—</span>':'<span class="num">'+esc(TERMS[r.payment_terms]||r.payment_terms||'')+'</span>')+'</td>'
      + '<td>'+(r.po_number?'<span class="mono">'+esc(r.po_number)+'</span>':(r.po_required?'<span class="pay unpaid">مطلوب</span>':'<span class="dash">—</span>'))+'</td>'
      + '<td>'+(r.nafith_number?'<span class="mono">'+esc(r.nafith_number)+'</span>':'<span class="dash">—</span>')+'</td>'
      + '<td>'+(r.invoice_number?'<span class="mono">'+esc(r.invoice_number)+'</span>':'<span class="dash">—</span>')+'</td>'
      + '<td>'+(r.due_date?'<span class="num">'+esc(r.due_date)+'</span>':'<span class="dash">—</span>')+'</td>'
      + '<td><span class="pay '+esc(r.payment_status)+'">'+esc(PAY[r.payment_status]||r.payment_status)+'</span></td>'
      + '<td>'+stChip(r.status)+'</td></tr>').join('')
    + '</tbody></table></div>';
}
function setF(k){ FILTER = k; render(); }

/* ---- الخطوة التالية لكل حالة ---- */
function nextStep(r){
  const bank = r.method === 'bank_transfer';
  if (r.status === 'cancelled' || r.status === 'paid' || (bank && r.status==='active' && r.payment_status==='paid')) return null;
  if (bank) {
    if (r.status === 'new') return { t:'الشركة تشوف الآيبان (الراجحي SA94 8000 0609 6080 1620 0938) في صفحتها مع رقم الطلب. أرسل الفاتورة على إيميل المالية واكتب رقمها هنا — ولو وصل التحويل قبلها أطلق الحملة مباشرة.', f:['invoice_number','due_date'], req:['invoice_number'], to:'invoiced', btn:'تم إصدار الفاتورة', alt: r.campaign_id ? {to:'paid', btn:'✅ وصل التحويل — أطلق الحملة'} : null };
    if (r.campaign_id) return { t:'أول ما يوصل التحويل على الحساب: علّمه مدفوع — تتثبّت صفقات المعلنين كمدفوعة وتنطلق الحملة مباشرة.', to:'paid', btn:'✅ استلمنا التحويل — أطلق الحملة', green:true };
    return { t:'أول ما يوصل التحويل على الحساب: علّمه مدفوع ويتفعّل اشتراك الشركة مباشرة.', to:['paid','active'], btn:'✅ استلمنا التحويل — فعّل الاشتراك', green:true };
  }
  switch (r.status) {
    case 'new': return { t:'راجع الطلب، حدّد قيمة العقد وشروط الدفع، ثم أرسل عرض السعر للشركة (يوصلها إشعار).', f:['contract_value','payment_terms'], req:['contract_value'], to: 'quote_sent', btn:'إرسال عرض السعر' };
    case 'quote_sent': return r.po_required
      ? { t:'بانتظار الشركة ترسل رقم PO من صفحتها. لو وصلك بالإيميل اكتبه هنا.', f:['po_number'], req:['po_number'], to:'awaiting_agreement', btn:'حفظ PO ← بانتظار الاتفاقية', alt:{to:'awaiting_po', btn:'علّمه «بانتظار PO»'} }
      : { t:'بانتظار الشركة توافق على اتفاقية الخدمة من صفحة الباقات.', to:'awaiting_agreement', btn:'علّمه «بانتظار قبول الاتفاقية»' };
    case 'awaiting_po': return { t:'بانتظار رقم أمر الشراء. لو وصلك بالإيميل اكتبه هنا.', f:['po_number'], req:['po_number'], to:'awaiting_agreement', btn:'حفظ PO ← بانتظار الاتفاقية' };
    case 'awaiting_agreement': return { t:'بانتظار الشركة توافق على الاتفاقية من صفحتها (تنتقل تلقائيًا لـ«بانتظار سند نافذ»).', to:'awaiting_nafith', btn:'وافقوا خارج المنصة ← انتقل لسند نافذ', confirm:'متأكد إن الشركة وافقت على الاتفاقية خارج المنصة؟' };
    case 'awaiting_nafith': return { t:'أصدر سند لأمر إلكتروني عبر منصة نافذ بقيمة العقد باسم المفوّض، اكتب رقم السند، وبعد ما تقبله الشركة اضغط الزر.', f:['nafith_number'], req:['nafith_number'], to:'nafith_accepted', btn:'تم قبول السند ✅', green:true };
    case 'nafith_accepted': return { t:'أصدر الفاتورة (ضريبية) واكتب رقمها. تاريخ الاستحقاق يتحسب تلقائيًا من شروط الدفع لو تركته فاضي.', f:['invoice_number','due_date'], req:['invoice_number'], to:'invoiced', btn:'تم إصدار الفاتورة' };
    case 'invoiced': return r.campaign_id
      ? { t:'الفاتورة صادرة. أطلق الحملة حسب شروط الاتفاق — يوصل المعلنين إشعار إنهم يبدؤون، والسداد في تاريخ الاستحقاق.', to:'active', btn:'🚀 إطلاق الحملة', green:true, alt:{to:'paid', btn:'سدّدوا مباشرة ← مدفوع'} }
      : { t:'الفاتورة صادرة. فعّل الاشتراك حسب شروط الاتفاق.', to:'active', btn:'تفعيل الاشتراك', green:true, alt:{to:'paid', btn:'سدّدوا مباشرة ← مدفوع'} };
    case 'active': case 'due_soon': case 'overdue':
      return { t: r.status==='overdue' ? 'الفاتورة متأخرة. تواصل مع مسؤول المالية، ولما يوصل السداد علّمه مدفوع.' : 'بانتظار السداد في تاريخ الاستحقاق '+(r.due_date||'')+'. لما يوصل علّمه مدفوع.', to:'paid', btn:'مدفوع ✅', green:true };
  }
  return null;
}
const FL = { contract_value:'قيمة العقد (ر.س)', payment_terms:'شروط الدفع', po_number:'رقم PO', nafith_number:'رقم سند نافذ', invoice_number:'رقم الفاتورة', due_date:'تاريخ الاستحقاق' };
function inputFor(k, r, pre){
  const id = (pre||'f_')+k, v = r[k]==null?'':r[k];
  if (k === 'payment_terms') return '<select id="'+id+'">'+Object.keys(TERMS).map(t => '<option value="'+t+'"'+(r.payment_terms===t?' selected':'')+'>'+TERMS[t]+'</option>').join('')+'</select>';
  if (k === 'due_date') return '<input id="'+id+'" type="date" value="'+esc(v)+'">';
  if (k === 'contract_value') return '<input id="'+id+'" type="number" min="0" step="0.01" dir="ltr" value="'+esc(v)+'">';
  return '<input id="'+id+'" dir="ltr" value="'+esc(v)+'">';
}

function openEd(id){
  const r = ROWS.find(x => x.id === id); if (!r) return;
  CUR = r;
  const n = nextStep(r);
  const bank = r.method === 'bank_transfer';
  const hist = (Array.isArray(r.history) ? r.history : []).slice().reverse();
  $('#ed').innerHTML =
    '<div class="ed-h"><div><div style="color:var(--dim);font-size:13px"><span class="mono">'+esc(r.ref)+'</span> · '+(bank?'🏦 تحويل بنكي':'💼 دفع آجل للشركات')+'</div><h2>'+esc(r.company_name)+'</h2><div style="margin-top:6px">'+stChip(r.status)+'</div></div><button class="x" onclick="closeEd()" aria-label="إغلاق">×</button></div>'
    + (n ? '<div class="next"><div class="t">الخطوة التالية</div><p>'+esc(n.t)+'</p>'
        + '<div class="row">'+(n.f||[]).map(k => '<label>'+FL[k]+(n.req&&n.req.includes(k)?' *':'')+inputFor(k, r, 'n_')+'</label>').join('')
        + '<button class="go'+(n.green?' green':'')+'" id="go" onclick="doNext()">'+esc(n.btn)+'</button>'
        + (n.alt?'<button class="btn2" onclick="doAlt()">'+esc(n.alt.btn)+'</button>':'')+'</div>'
        + '<div id="n-err" style="color:var(--bad);font-size:12.5px;margin-top:6px"></div></div>'
      : '<div class="next" style="background:var(--good-soft);border-color:rgba(29,143,107,.3)"><div class="t" style="color:var(--good)">مكتمل</div><p>'+(r.status==='cancelled'?'الطلب ملغي.':'تم السداد'+(r.paid_at?' بتاريخ '+fmtD(r.paid_at):'')+'.')+'</p></div>')
    + '<div class="sec" style="border-top:0;margin-top:0;padding-top:0">بيانات الشركة</div><div class="grid">'
    + '<label>اسم الشركة<input id="f_company_name" value="'+esc(r.company_name)+'"></label>'
    + '<label>السجل التجاري<input id="f_cr_number" dir="ltr" value="'+esc(r.cr_number||'')+'"></label>'
    + '<label>مسؤول المالية<input id="f_finance_name" value="'+esc(r.finance_name||'')+'"></label>'
    + '<label>إيميل المالية<input id="f_finance_email" dir="ltr" value="'+esc(r.finance_email||'')+'"></label>'
    + '<label>جوال المالية<input id="f_finance_phone" dir="ltr" value="'+esc(r.finance_phone||'')+'"></label>'
    + '<label>حساب الشركة على المنصة<div class="ro mono">'+esc(r.brand_email||'—')+'</div></label>'
    + '</div>'
    + '<div class="sec">العقد والسداد</div><div class="grid">'
    + (r.campaign_id
        ? '<label>الحملة<div class="ro">'+esc(r.campaign_title||'')+' · '+(r.deals||0)+' صفقة</div></label>'
          + '<label>التفصيل<div class="ro">مستحقات المعلنين '+sar(r.net_sar)+' + عمولة '+sar(r.commission_pct)+'٪ = '+sar(r.commission_sar)+' ر.س</div></label>'
        : '<label>الباقة<div class="ro">'+esc(r.plan_name||r.plan_code)+' · '+periodAr(r.period)+'</div></label>')
    + '<label>'+FL.contract_value+inputFor('contract_value', r)+'</label>'
    + (bank ? '' : '<label>'+FL.payment_terms+inputFor('payment_terms', r)+'</label>')
    + (bank ? '' : '<label>PO مطلوب؟<select id="f_po_required"><option value="false"'+(!r.po_required?' selected':'')+'>لا</option><option value="true"'+(r.po_required?' selected':'')+'>نعم</option></select></label>')
    + (bank ? '' : '<label>'+FL.po_number+inputFor('po_number', r)+'</label>')
    + (bank ? '' : '<label>'+FL.nafith_number+inputFor('nafith_number', r)+'</label>')
    + '<label>'+FL.invoice_number+inputFor('invoice_number', r)+'</label>'
    + '<label>'+FL.due_date+inputFor('due_date', r)+'</label>'
    + '<label>حالة السداد<div class="ro"><span class="pay '+esc(r.payment_status)+'">'+esc(PAY[r.payment_status]||r.payment_status)+'</span>'+(r.paid_at?' · '+fmtD(r.paid_at):'')+'</div></label>'
    + (bank ? '' : '<label>الموافقة على الاتفاقية<div class="ro">'+(r.agreement_accepted_at?'✓ '+esc(r.agreement_accepted_by||'')+' · '+fmtD(r.agreement_accepted_at):'لم تتم بعد')+'</div></label>')
    + '<label class="full">ملاحظات الشركة<div class="ro">'+esc(r.brand_notes||'—')+'</div></label>'
    + '<label class="full">ملاحظات داخلية (ما تظهر للشركة)<textarea id="f_admin_notes">'+esc(r.admin_notes||'')+'</textarea></label>'
    + '<label class="full">تغيير الحالة يدويًا<select id="f_status">'+ST.map(x => '<option value="'+x[0]+'"'+(r.status===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></label>'
    + '</div>'
    + '<div class="foot"><button class="ghost" onclick="cancelReq()"'+(r.status==='cancelled'?' disabled':'')+'>إلغاء الطلب</button><button class="go" id="save" onclick="saveAll()">حفظ التعديلات</button></div>'
    + (hist.length ? '<div class="sec">السجل</div><ul class="hist">'+hist.map(h => '<li>'+stChip(h.status)+' <span>'+fmtD(h.at)+' · '+esc(h.by==='system'?'تلقائي':h.by==='brand'?'الشركة':'الإدارة')+'</span>'+(h.note?' — '+esc(h.note):'')+'</li>').join('')+'</ul>' : '');
  $('#ov').classList.add('on');
}
function closeEd(){ $('#ov').classList.remove('on'); CUR = null; }

async function patch(p, label){
  if (BUSY || !CUR) return false;
  BUSY = true;
  const { data, error } = await sb.rpc('b2b_admin_update', { p_id: CUR.id, p_patch: p });
  BUSY = false;
  if (error || (data && data.error)) { toast('تعذّر الحفظ: '+((error&&error.message)||(data&&data.error)||'')); return false; }
  if (label) toast(label);
  return true;
}
async function reloadKeep(){
  const id = CUR && CUR.id;
  await load();
  if (id) openEd(id);
}
async function doNext(){
  const n = nextStep(CUR); if (!n) return;
  const err = $('#n-err'); err.textContent = '';
  const p = {};
  for (const k of (n.f||[])) {
    const v = ($('#n_'+k).value||'').trim();
    if (n.req && n.req.includes(k) && !v) { err.textContent = 'عبّئ «'+FL[k]+'» أولًا.'; return; }
    if (v || k==='due_date') p[k] = v;
  }
  if (n.confirm && !confirm(n.confirm)) return;
  $('#go').disabled = true;
  const steps = Array.isArray(n.to) ? n.to : [n.to];
  for (let i = 0; i < steps.length; i++) {
    const ok = await patch(i === 0 ? Object.assign(p, { status: steps[i] }) : { status: steps[i] });
    if (!ok) { $('#go').disabled = false; return; }
  }
  toast('تم: '+STL[steps[steps.length-1]]+' — وصل الشركة إشعار');
  reloadKeep();
}
async function doAlt(){
  const n = nextStep(CUR); if (!n || !n.alt) return;
  if (await patch({ status: n.alt.to }, 'تم: '+STL[n.alt.to])) reloadKeep();
}
async function saveAll(){
  const r = CUR; if (!r) return;
  const val = id => { const el = $('#'+id); return el ? String(el.value).trim() : undefined; };
  const p = {};
  ['company_name','cr_number','finance_name','finance_email','finance_phone','contract_value','payment_terms','po_number','nafith_number','invoice_number','due_date','admin_notes'].forEach(k => {
    const v = val('f_'+k); if (v === undefined) return;
    const old = r[k] == null ? '' : String(r[k]);
    if (k === 'contract_value' ? (v === '' ? old !== '' : Number(v) !== Number(old)) : v !== old) p[k] = v;
  });
  const por = val('f_po_required'); if (por !== undefined && (por === 'true') !== !!r.po_required) p.po_required = por === 'true';
  const st = val('f_status');
  if (st && st !== r.status) {
    if (st === 'active' && r.contract_value == null && !p.contract_value) { toast('حدّد قيمة العقد قبل التفعيل.'); return; }
    if (!confirm('تغيير الحالة إلى «'+STL[st]+'»؟ يوصل الشركة إشعار'+(st==='active'?(r.campaign_id?' وتنطلق الحملة':' ويتفعّل اشتراكها'):'')+(st==='paid'&&r.campaign_id?' وتتثبّت صفقات المعلنين كمدفوعة':'')+'.')) return;
    p.status = st;
  }
  if (!Object.keys(p).length) { toast('ما فيه تعديلات.'); return; }
  $('#save').disabled = true;
  if (await patch(p, 'تم الحفظ ✓')) reloadKeep(); else $('#save').disabled = false;
}
async function cancelReq(){
  const note = prompt('سبب الإلغاء (يُحفظ في السجل):', '');
  if (note === null) return;
  if (await patch({ status: 'cancelled', note: note }, 'تم إلغاء الطلب')) reloadKeep();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEd(); });

async function load(){
  const { data, error } = await sb.rpc('b2b_admin_list');
  if (error) { $('#app').innerHTML = '<div class="err">تعذّر التحميل. تأكد إنك داخل بحساب الأدمن. <a href="/login.html">تسجيل الدخول</a></div>'; return; }
  ROWS = Array.isArray(data) ? data : []; render();
}
(async function boot(){
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { $('#app').innerHTML = '<div class="err">يلزم تسجيل الدخول بحساب الأدمن. <a href="/login.html">تسجيل الدخول</a></div>'; return; }
  const { data: isA } = await sb.rpc('is_platform_admin');
  if (isA !== true) { $('#app').innerHTML = '<div class="err">هذا الحساب ما عنده صلاحية الأدمن.</div>'; return; }
  await load();
  const q = new URLSearchParams(location.search).get('id'); if (q) openEd(q);
  setInterval(() => { if (!document.hidden && !$('#ov').classList.contains('on')) load(); }, 60000);
})();
</script>
</body>
</html>
