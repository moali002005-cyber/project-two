 /* ---- الخط الزمني ---- */
 var LOOP=8.8, t0=null, running=false, st=-1;
 function setPhase(k){ if(k===st)return; st=k;
   cap.className='mtcap p'+k;
   if(k<2){ btn.classList.remove('done'); }
 }
 function frame(now){
  if(!running) return;
  if(t0===null) t0=now;
  var t=((now-t0)/1000)%LOOP;

  /* المشهد الأول */
  var aIn=ease(seg(t,0.15,0.95));
  var aOut=1-ease(seg(t,3.20,4.05));
  var aOp=aIn*aOut;
  var aSc=lerp(1,0.12,ease(seg(t,3.20,4.05)));
  gA.setAttribute('opacity',aOp.toFixed(3));
  gA.setAttribute('transform','translate(450,344) scale('+aSc.toFixed(3)+') translate(-450,-344)');

  ppl.forEach(function(o,i){
   var app=ease(seg(t,0.25+i*0.045,0.75+i*0.045));
   var bob=Math.sin(t*2.4+i*0.9)*2.2;
   var p=pos[i];
   o.g.setAttribute('opacity',app.toFixed(3));
   o.g.setAttribute('transform','translate('+p[0].toFixed(1)+','+(p[1]+bob).toFixed(1)+')');
  });

  var chaos=ease(seg(t,0.9,1.6))*(1-ease(seg(t,2.85,3.35)));
  linkEls.forEach(function(o,i){
   o.ln.setAttribute('opacity',(chaos*0.85).toFixed(3));
   o.ln.setAttribute('stroke-dashoffset',((-t*26+i*9)%120).toFixed(1));
   var q=((t*0.55+o.ph)%1);
   o.dot.setAttribute('cx',lerp(o.a[0],o.b[0],q).toFixed(1));
   o.dot.setAttribute('cy',lerp(o.a[1],o.b[1],q).toFixed(1));
   o.dot.setAttribute('opacity',(chaos*Math.sin(q*Math.PI)).toFixed(3));
  });

  /* المشهد الثاني */
  var bIn=ease(seg(t,3.85,4.50));
  var bOut=1-ease(seg(t,8.10,8.70));
  solo.setAttribute('opacity',(bIn*bOut).toFixed(3));

  var wIn=ease(seg(t,4.30,5.00)), wOut=1-ease(seg(t,8.10,8.70));
  var wS=lerp(0.88,1,out3(seg(t,4.30,5.15)));
  win.style.opacity=(wIn*wOut).toFixed(3);
  win.style.transform='translate(-50%,0) scale('+wS.toFixed(3)+')';

  /* المؤشر والضغطة */
  var cIn=ease(seg(t,5.10,5.45)), cOut=1-ease(seg(t,7.70,8.15));
  var ww=win.offsetWidth||280, wh=win.offsetHeight||190;
  var bx=ww*0.63, by=wh-30;
  var mv=out3(seg(t,5.30,6.25));
  var cx=lerp(ww+30,bx,mv), cy=lerp(wh+58,by,mv);
  var press=(t>6.30&&t<6.50)?2:0;
  cur.style.opacity=(cIn*cOut).toFixed(3);
  cur.style.transform='translate('+(cx+press)+'px,'+(cy+press)+'px)';
  if(t>6.42&&t<8.1) btn.classList.add('done'); else btn.classList.remove('done');

  setPhase(t<3.4?1:2);
  requestAnimationFrame(frame);
 }
 function start(){ if(running)return; running=true; t0=null; requestAnimationFrame(frame); }
 stage.classList.add('in');
 if(!('IntersectionObserver' in window)){ start(); return; }
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)start();});},{threshold:0.2});
 io.observe(stage);
}

 mtWire();
 document.getElementById('rep').addEventListener('click',function(){ location.reload(); });
})();
</script>
</body></html>
