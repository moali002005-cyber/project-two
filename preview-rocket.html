e="width: 49px;"></div><div class="rkstreak" style="width: 72px;"></div><div class="rkstreak" style="width: 95px;"></div></div></div></div></sect></div>
<script>
(function(){
function rkWire(){
 var w=document.querySelector('.fh .rkw'); if(!w)return;
 var sky=document.getElementById('rkSky'), ship=document.getElementById('rkShip'),
     grid=document.getElementById('rkGrid');
 var wrap=grid?grid.parentNode:null;
 var cells=grid?[].slice.call(grid.querySelectorAll('.rkcell')):[];
 var NSS='http://www.w3.org/2000/svg';
 function cl(v,a,b){return v<a?a:(v>b?b:v);}
 function ease(t){return t<0?0:(t>1?1:t*t*(3-2*t));}
 function out3(t){t=cl(t,0,1);return 1-Math.pow(1-t,3);}
 function out5(t){t=cl(t,0,1);return 1-Math.pow(1-t,5);}
 function seg(t,a,b){return cl((t-a)/(b-a),0,1);}
 function lerp(a,b,t){return a+(b-a)*t;}
 function E(t,a,p){var e=document.createElementNS(NSS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

 /* ===== الصاروخ: الفلفلة + مخروط أنف + زعانف + كوّة + لهب (كلها بإحداثيات الشعار) ===== */
 fetch('/brand/chili.svg').then(function(r){return r.text();}).then(function(t){
  var d=new DOMParser().parseFromString(t,'image/svg+xml'), src=d.documentElement;
  var vb=(src.getAttribute('viewBox')||'0 0 300 300').split(/[\s,]+/).map(Number);
  var cx=vb[0]+vb[2]/2, cy=vb[1]+vb[3]/2, sc=336/vb[3];
  var g=document.getElementById('rkChiliG'); if(!g) return;
  g.setAttribute('transform','translate(224,96) scale('+sc.toFixed(4)+') rotate(90) translate('+(-cx)+','+(-cy)+')');
  g.setAttribute('transform','translate(224,96) scale('+(sc*1.18).toFixed(4)+','+(sc*0.92).toFixed(4)+') rotate(62) translate('+(-cx)+','+(-cy)+')');

  [].slice.call(src.querySelectorAll('path')).forEach(function(pp){ g.appendChild(pp.cloneNode(true)); });
  setTimeout(function(){
   try{
    var svgEl=ship.querySelector('svg');
    var sr=svgEl.getBoundingClientRect(), gr=g.getBoundingClientRect();
    if(!sr.width||!gr.width) return;
    var kx=470/sr.width, ky=192/sr.height;
    var ax=(gr.right-sr.left)*kx-30, ay=(gr.top+gr.height*0.58-sr.top)*ky;
    var fh=document.getElementById('rkFlameH'); if(!fh) return;
    fh.innerHTML='';
    var fg2=E('g',{id:'rkFlame'},fh);
    E('ellipse',{cx:ax+84,cy:ay,rx:92,ry:15,fill:'url(#rkFl)',opacity:'.5'},fg2);
    E('ellipse',{cx:ax+44,cy:ay,rx:50,ry:10,fill:'url(#rkFl)',opacity:'.9'},fg2);
    E('ellipse',{cx:ax+18,cy:ay,rx:22,ry:6,fill:'#FFD9BE',opacity:'.95'},fg2);
    fg2.setAttribute('data-ox',ax); fg2.setAttribute('data-oy',ay);
   }catch(e){}
  },30);


 })['catch'](function(){});

 /* ===== خطوط الهواء ===== */
 var lines=[];
 for(var i=0;i<16;i++){
  var d=document.createElement('div'); d.className='rkstreak';
  d.style.width=(30+((i*23)%70))+'px';
  sky.appendChild(d);
  lines.push({el:d,y:14+((i*47)%150),ph:(i*0.137)%1,sp:0.55+((i*31)%40)/70});
 }
 var W=0,H=0,CY=0,TW=0;
 function measure(){ W=sky.clientWidth; H=sky.clientHeight; CY=Math.round(H*0.5); TW=wrap?wrap.clientWidth:W; }
 measure(); window.addEventListener('resize',measure);

 var t0=null, running=false, SWEEP=2.6, HOLD=3.6, LOOP=SWEEP+HOLD;
 function frame(now){
  if(!running) return;
  if(t0===null) t0=now;
  var el=(now-t0)/1000;
  if(el>LOOP){ t0=now; el=0; cells.forEach(function(c){c.classList.remove('on');}); }
  if(!W) measure();

  /* الصاروخ ثابت في النص مع اهتزاز خفيف */
  var bob=Math.sin(el*7.2)*3.2, tilt=Math.sin(el*5.1)*0.7;
  ship.style.opacity='1';
  ship.style.transform='translate(0,'+bob.toFixed(2)+'px) rotate('+tilt.toFixed(2)+'deg)';
  var fl=document.getElementById('rkFlame');
  if(fl){ var fk=0.80+0.24*Math.sin(el*34);
   var ox=parseFloat(fl.getAttribute('data-ox')||'0'), oy=parseFloat(fl.getAttribute('data-oy')||'0');
   fl.setAttribute('transform','translate('+ox+','+oy+') scale('+fk.toFixed(3)+',1) translate('+(-ox)+','+(-oy)+')'); }

  /* الهواء يتحرك */
  lines.forEach(function(o){
   var q=(el*o.sp*0.9+o.ph)%1;
   var x=lerp(W+90,-140,q);
   o.el.style.transform='translate('+x.toFixed(1)+'px,'+o.y+'px)';
   o.el.style.opacity=(0.10+0.42*Math.sin(q*Math.PI)).toFixed(2);
  });

  requestAnimationFrame(frame);
 }
 function start(){ if(running)return; running=true; t0=null; measure(); requestAnimationFrame(frame); }
 w.classList.add('in');
 if(!('IntersectionObserver' in window)){ start(); return; }
 var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) start(); }); },{threshold:0.18});
 io.observe(w);
}

 rkWire();
 document.getElementById('rep').addEventListener('click',function(){ location.reload(); });
})();
</script>
