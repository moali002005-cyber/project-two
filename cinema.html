<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فلفلونسر — الفلفلة تتحوّل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap">
<style>
:root{--r:#EC1C24;--ink:#1A1512;--dim:#8A807B;--ln:#F1ECE9}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;
 line-height:1.9;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
h1,h3{margin:0;font-weight:900;text-wrap:balance;letter-spacing:-.01em}
.head{padding:52px 0 0;text-align:center}
.kick{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.14em}
.head h1{font-size:clamp(24px,3.6vw,34px);margin-top:12px}
.head h1 em{font-style:normal;color:var(--r)}
.stage{position:relative;width:100%;max-width:760px;margin:26px auto 0;aspect-ratio:760/440}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
#bg{z-index:1!important}
#line{fill:none;stroke:url(#brand);stroke-linecap:round;stroke-linejoin:round}
.cards{position:absolute;inset:0;z-index:2}
figure{position:absolute;left:50%;top:50%;margin:0;width:80%;aspect-ratio:600/384;
 transform:translate(-50%,-50%);opacity:0;pointer-events:none;
 border:1px solid rgba(26,21,18,.07);border-radius:20px;background:#fff;overflow:hidden;
 box-shadow:0 26px 52px -30px rgba(26,21,18,.22),0 1px 4px rgba(26,21,18,.03)}
.bar{height:10.4%;display:flex;align-items:center;padding:0 12px;background:#FCFAF9;
 border-bottom:1px solid var(--ln)}
.tag{flex:1;height:62%;border-radius:999px;background:#fff;border:1px solid var(--ln);
 display:flex;align-items:center;justify-content:center;font-size:11px;color:#B3A9A4;
 font-weight:500}
.view{height:89.6%;background:#fff}
.shine{position:absolute;inset:0;direction:ltr;pointer-events:none;opacity:0;
 background:linear-gradient(112deg,transparent 34%,rgba(255,255,255,.72) 48%,transparent 62%)}
.view svg{width:100%;height:100%;display:block;direction:ltr}
.view text{font-family:"Tajawal",sans-serif}
.caps{position:relative;min-height:124px;margin-top:20px;text-align:center}
.cap{position:absolute;inset:0;opacity:0;transform:translateY(8px);
 transition:opacity .26s ease,transform .5s cubic-bezier(.16,1,.3,1);pointer-events:none}
.cap.on{opacity:1;transform:none}
.cap h3{font-size:clamp(20px,2.8vw,27px)}
.cap p{margin:6px auto 0;max-width:50ch;color:var(--dim);font-size:15.5px;font-weight:400}
.rail{display:flex;gap:7px;justify-content:center;margin-top:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#E8E1DD;border:0;padding:0;cursor:pointer;
 transition:all .4s cubic-bezier(.16,1,.3,1)}
.dot.on{background:var(--r);width:20px;border-radius:999px}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:18px}
.ctl button{background:transparent;color:var(--dim);border:1px solid var(--ln);border-radius:999px;
 padding:7px 16px;font:inherit;font-weight:500;font-size:13px;cursor:pointer;transition:.2s}
.ctl button:hover{color:var(--ink);border-color:#DCD3D0}
.foot{padding:26px 0 72px;color:#B3A9A4;text-align:center;font-size:14px}
@media(max-width:640px){.caps{min-height:152px}figure{width:94%}}
</style></head><body>
<header class="head"><div class="wrap">
<div class="kick">آلية العمل</div>
<h1>حملاتك الإعلانية <em>بمكان واحد</em> — والفلفلة توريك كيف.</h1>
</div></header>
<div class="wrap">

    <stop offset="52%" stop-color="#EC1C24"/><stop offset="78%" stop-color="#3777BB"/>
    <stop offset="100%" stop-color="#7C51A0"/></linearGradient>
   <filter id="wash2" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="34"/></filter></defs>
   <ellipse id="halo" cx="360" cy="210" rx="208" ry="124" fill="url(#brand2)" opacity="0" filter="url(#wash2)"/>
  </svg>
  <div class="cards" id="cards"></div>
  <svg id="art" viewBox="0 0 720 420" aria-label="الفلفلة تتحوّل بين خطوات العمل">
   <defs>
    <linearGradient id="brand" x1="0.15" y1="0" x2="0.85" y2="1">
     <stop offset="0%" stop-color="#0DB04B"/><stop offset="22%" stop-color="#FCB813"/>
     <stop offset="52%" stop-color="#EC1C24"/><stop offset="78%" stop-color="#3777BB"/>
     <stop offset="100%" stop-color="#7C51A0"/></linearGradient>
    <filter id="wash" x="-40%" y="-40%" width="180%" height="180%">
     <feGaussianBlur stdDeviation="34"/></filter>
   </defs>
   <g id="sparks"></g>
   <circle id="pulse" cx="360" cy="210" r="40" fill="none" stroke="url(#brand)" stroke-width="2" opacity="0"/>
   <g id="logo"></g>
   <g id="lineG"><path id="line" opacity="0"></path>
    <g id="spark" opacity="0"><circle r="10" fill="#fff" opacity=".45"/><circle r="4.6" fill="#fff"/></g></g>
  </svg>
</div>
<div class="caps" id="caps"></div>
<div class="rail" id="dots"></div>
<div class="ctl">
 <button type="button" id="again">من البداية</button>
 <button type="button" id="hold">إيقاف</button>
</div>
<p class="foot">رسم متحرّك بالكامل — الفلفلة من ملف الهوية نفسه.</p>
</div>

function along(t,pts){ /* pts:[[t,x,y]...] eased between */

 return function(t){

 foot.textContent="يبدأ الوكيل بالتفاوض معهم الآن";

 return function(t){

   try{var p=line.getPointAtLength(LEN*dr);

  } else comet.setAttribute("opacity","0");

  var fk=seg(t,1.30,1.95);

  pts.forEach(function(pt,i){
   var a=1.55+i*0.16, k=out5(seg(t,a,a+0.40));
   pt.g.setAttribute("opacity",k.toFixed(2));
   var rk=seg(t,a,a+0.75);
   if(rk>0&&rk<1){ pt.rip.setAttribute("r",(4+30*out3(rk)).toFixed(1));

   else pt.rip.setAttribute("opacity","0");
   pt.lab.setAttribute("opacity",out3(seg(t,a+0.22,a+0.62)).toFixed(2));
  });
  var bk=seg(t,2.15,2.6);
  divi.setAttribute("opacity",bk.toFixed(2));
  big.setAttribute("opacity",bk.toFixed(2));
  bigL.setAttribute("opacity",bk.toFixed(2));
  big.textContent=fmt(lerp(0,118,ease(seg(t,2.2,3.3))));
  foot.setAttribute("opacity",out3(seg(t,3.3,3.7)).toFixed(2));
 };
}

/* ---------- S0: الصفحة الرئيسية للشركة — ومنها ينطلق كل شيء ---------- */
function S0(root){
 E("rect",{x:0,y:0,width:600,height:344,fill:"#fff"},root);
 var pill=E("g",{opacity:"0"},root);
 E("rect",{x:252,y:18,width:96,height:22,rx:11,fill:"#F1FAF4",stroke:"#D7EEE0"},pill);

 sub.textContent="أطلق حملتك، والوكيل يفاوض ويقفل لك.";

 /* صف الأزرار — الترتيب من اليمين */
 var BT=[{t:"متابعة الحملات",w:118,p:1},{t:"حملة جديدة",w:110,p:0,plus:1},
         {t:"الأداء",w:64,p:0},{t:"الحملات السابقة",w:120,p:0}];
 var total=0; BT.forEach(function(b){total+=b.w;}); total+=10*(BT.length-1);
 var x0=300+total/2, btns=[];
 BT.forEach(function(b){
  var x=x0-b.w;
  var g=E("g",{opacity:"0"},root);
  var r=E("rect",{x:x,y:112,width:b.w,height:33,rx:16.5,
   fill:b.p?R:"#fff",stroke:b.p?R:"#E4DDDA"},g);
  var tx=E("text",{x:x+b.w/2,y:133.5,"text-anchor":"middle","font-size":"12","font-weight":"900",
   fill:b.p?"#fff":INK},g);
  tx.textContent=b.t;
  if(b.plus){
   tx.setAttribute("x",x+b.w/2+7);
   var px=x+14;
   E("rect",{x:px-6,y:127,width:12,height:2.4,rx:1.2,fill:INK,opacity:"0.75"},g);
   E("rect",{x:px-1.2,y:122.2,width:2.4,height:12,rx:1.2,fill:INK,opacity:"0.75"},g);
  }
  btns.push({g:g,r:r,t:tx,cx:x+b.w/2,cy:128.5,w:b.w,x:x});
  x0=x-10;
 });

 /* شريط الاشتراك */
 var strip=E("g",{opacity:"0"},root);
 E("rect",{x:130,y:164,width:340,height:50,rx:14,fill:"#fff",stroke:LN},strip);
 E("rect",{x:426,y:176,width:28,height:26,rx:9,fill:"#FDECEA"},strip);
 E("rect",{x:431,y:183,width:18,height:12,rx:3,fill:"none",stroke:R,"stroke-width":"1.6"},strip);
 E("rect",{x:431,y:187,width:18,height:1.6,fill:R,opacity:"0.55"},strip);
 E("text",{x:414,y:188,"text-anchor":"end","font-size":"12","font-weight":"900",fill:INK},strip)
  .textContent="الاشتراك الحالي: جرّب فلفل";
 E("text",{x:414,y:203,"text-anchor":"end","font-size":"10.5","font-weight":"700",fill:DIM},strip)
  .textContent="عمولة 15٪ على كل صفقة";

 /* بطاقة نخبة المؤثرين */
 var elite=E("g",{opacity:"0"},root);
 E("rect",{x:96,y:230,width:408,height:66,rx:16,fill:"#fff",stroke:LN},elite);
 E("text",{x:484,y:256,"text-anchor":"end","font-size":"13","font-weight":"900",fill:INK},elite)
  .textContent="نخبة المؤثرين";
 E("text",{x:484,y:274,"text-anchor":"end","font-size":"10.5","font-weight":"700",fill:DIM},elite)
  .textContent="أفضل 500 مؤثر بدرجة الثقة";
 for(var a=0;a<4;a++){
  E("circle",{cx:330-a*15,cy:263,r:11,fill:"#fff"},elite);
  E("circle",{cx:330-a*15,cy:263,r:9.5,fill:[G,Y,B,P][a],opacity:"0.85"},elite);
 }
 E("rect",{x:116,y:250,width:84,height:26,rx:13,fill:R},elite);
 E("text",{x:158,y:267,"text-anchor":"middle","font-size":"11","font-weight":"900",fill:"#fff"},elite)
  .textContent="النخبة ←";

 var cur=cursor(root);
 return function(t){
  pill.setAttribute("opacity",out3(seg(t,0.05,0.4)).toFixed(2));
  ttl.setAttribute("opacity",out3(seg(t,0.18,0.55)).toFixed(2));
  sub.setAttribute("opacity",out3(seg(t,0.30,0.68)).toFixed(2));
  btns.forEach(function(b,i){
   var k=out5(seg(t,0.45+i*0.09,1.0+i*0.09));
   b.g.setAttribute("opacity",k.toFixed(2));
   b.g.setAttribute("transform","translate(0,"+((1-k)*10).toFixed(1)+")");
  });
  strip.setAttribute("opacity",out3(seg(t,0.95,1.4)).toFixed(2));
  elite.setAttribute("opacity",out3(seg(t,1.15,1.6)).toFixed(2));

  /* المؤشّر يتّجه إلى «حملة جديدة» ويضغطها */
  var nb=btns[1];
  var hov=seg(t,2.15,2.35);
  var press=seg(t,2.55,2.68);
  nb.r.setAttribute("fill", press>0&&press<1 ? "#C4331F" : (hov>0? "#FDECEA" : "#fff"));
  nb.r.setAttribute("stroke", hov>0 ? R : "#E4DDDA");
  nb.t.setAttribute("fill", press>0&&press<1 ? "#fff" : (hov>0 ? R : INK));
  nb.g.setAttribute("transform", (press>0&&press<1) ? "translate(0,1)" : "translate(0,0)");
  var pos=along(t,[[0,520,310],[1.6,430,220],[2.3,nb.cx+6,nb.cy+6],[3.2,nb.cx+6,nb.cy+6]]);
  cur.at(pos[0],pos[1],cl(seg(t,0.9,1.3))*(1-seg(t,3.0,3.4)*0.9));
  cur.click(seg(t,2.55,3.0));
 };
}

var BUILD=[S0,S2,S7,S9,S8,S4,S5,S6,S1];
var F=[
 {k:"doc",tag:"لوحتك",h:"كل شي يبدأ من لوحتك",
  p:"تفتح المنصة وتضغط «حملة جديدة» — وهذا كل ما يلزمك لتبدأ."},
 {k:"coin",tag:"حملة جديدة",h:"تطلق حملتك خلال ٦٠ ثانية",
  p:"تحدّد النوع والعنوان والميزانية — والبريف يكتبه لك النظام."},
 {k:"box",tag:"مواصفات الحملة",h:"تحدّد مين تبي بالضبط",
  p:"عدد المعلنين من ٥ إلى ٢٠٠، والمنصة، ونطاق المتابعين، والمدينة."},
 {k:"play",tag:"انطلاق الحملة",h:"وتنطلق حملتك على الخريطة",
  p:"نرسم نطاق حملتك، وتضيء المدن التي وصلها إعلانك — نفس الشاشة التي تراها داخل المنصة."},
 {k:"bubble",tag:"مفاوضة الوكيل",h:"ويفاوضهم كلهم في نفس اللحظة",
  p:"مئة مفاوضة مفتوحة معاً بالعربي — كل واحدة لحالها، وتقف تلقائياً عند اكتمال العدد."},
 {k:"check",tag:"العروض المستلمة",h:"يعطيك القائمة وتعتمد المناسب",
  p:"كل معلن وسعره أمامك — تختار اللي يناسبك وبس."},
 {k:"steps",tag:"متابعة الحملة",h:"تتابع كل خطوة بصفحة وحدة",
  p:"العنوان، الشحن، الاستلام، المحتوى، الموافقة، النشر — سبع مراحل في سطر واحد."},
 {k:"chart",tag:"الأداء",h:"وتشوف النتايج",
  p:"إجمالي الإنفاق، الصفقات المعتمدة، والعروض — لحظة بلحظة."},
 {k:"doc",tag:"لوحة الحملات",h:"حملاتك الإعلانية بمكان واحد",
  p:"وكل حملة تطلقها تنضاف هنا — لوحة واحدة بدل ملفات وجروبات متفرّقة."}
];

var INTRO=1.5,UNFURL=0.8,SEG=4.5,GATHER=1.0,ENDHOLD=1.1,XOVER=0.36;
var F0=INTRO+UNFURL, FEND=F0+F.length*SEG, TOTAL=FEND+GATHER+ENDHOLD;
var CARD_S=-0.22,CARD_E=0.50,COUT_S=SEG-0.26,XOUT=0.26;
var CX=360,CY=210,RX=318,RY=202,BADGE_X=583,BADGE_Y=54,NEXP=3.4;

var NUM={},TPL=null;
for(var k in ICONS){NUM[k]=ICONS[k].match(/-?\d+(?:\.\d+)?/g).map(Number);
 if(!TPL)TPL=ICONS[k].replace(/-?\d+(?:\.\d+)?/g,"#");}
function pathAt(a,b,t){var A=NUM[a],B=NUM[b],i=0;
 return TPL.replace(/#/g,function(){var v=A[i]+(B[i]-A[i])*t;i++;return v.toFixed(1);});}

var logoG=document.getElementById("logo"),lineG=document.getElementById("lineG"),
    line=document.getElementById("line"),spark=document.getElementById("spark"),
    halo=document.getElementById("halo"),pulse=document.getElementById("pulse"),
    sparksG=document.getElementById("sparks"),
    cardsEl=document.getElementById("cards"),capsEl=document.getElementById("caps"),
    dotsEl=document.getElementById("dots");

var figs=[],draws=[],shines=[];
F.forEach(function(f,i){
 var fg=document.createElement("figure");
 fg.innerHTML='<div class="bar"><div class="tag">'+f.tag+'</div></div><div class="view"></div><i class="shine"></i>';
 cardsEl.appendChild(fg);
 var svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox","0 0 600 344");
 fg.querySelector(".view").appendChild(svg);
 draws.push(BUILD[i](svg)); figs.push(fg); shines.push(fg.querySelector(".shine"));
});

var CAPS=[{h:"أنا فلفل",p:"مدير حملاتك الذكي. من إطلاق الحملة إلى النتايج — خلّني أوريك."}]
 .concat(F.map(function(f){return {h:f.h,p:f.p};}))
 .concat([{h:"وأرجع فلفلة",p:"حملة كاملة، من غير مكالمة وحدة."}]);
var capEls=CAPS.map(function(c,i){var d=document.createElement("div");
 d.className="cap"+(i===0?" on":"");d.innerHTML="<h3>"+c.h+"</h3><p>"+c.p+"</p>";
 capsEl.appendChild(d);return d;});
var dotEls=F.map(function(f,i){var b=document.createElement("button");
 b.type="button";b.className="dot";b.setAttribute("aria-label",f.h);
 b.addEventListener("click",function(){seek(F0+i*SEG+0.05);});
 dotsEl.appendChild(b);return b;});

var COL=[G,Y,R,B,P],motes=[];
for(var i=0;i<9;i++){
 var c=document.createElementNS(NS,"circle");
 c.setAttribute("r",(1.0+Math.random()*1.5).toFixed(2));
 c.setAttribute("fill",COL[i%COL.length]); c.setAttribute("opacity","0");
 sparksG.appendChild(c);
 motes.push({el:c,a:Math.random()*6.283,sp:0.18+Math.random()*0.35,ph:Math.random()*6.283,
  bo:5+Math.random()*10,sq:0.5+Math.random()*0.7,f:1.02+Math.random()*0.16});
}

var ribbons=[],t0=performance.now(),paused=false,pauseAt=0,curCap=-1;
fetch("/brand/chili.svg").then(function(r){return r.text();}).then(function(txt){
 var d=new DOMParser().parseFromString(txt,"image/svg+xml"),src=d.documentElement;
 var vb=(src.getAttribute("viewBox")||"0 0 300 300").split(/[\s,]+/).map(Number);
 var s=Math.min(250/vb[2],250/vb[3]);
 var tx=CX-(vb[0]+vb[2]/2)*s, ty=CY-(vb[1]+vb[3]/2)*s;
 var ht="translate("+tx+","+ty+") scale("+s+")";
 [].slice.call(src.querySelectorAll("path")).forEach(function(p,i){
  var wrap=document.createElementNS(NS,"g"), inner=document.createElementNS(NS,"g");
  inner.setAttribute("transform",ht);
  var n=p.cloneNode(true); inner.appendChild(n); wrap.appendChild(inner); logoG.appendChild(wrap);
  var bb=n.getBBox();
  ribbons.push({g:wrap,cx:tx+(bb.x+bb.width/2)*s,cy:ty+(bb.y+bb.height/2)*s,
   rj:0.96+((i*37)%23)/100,bo:((i*53)%17)-8,sp:0.34+((i*29)%11)/70});
 });
 ribbons.forEach(function(rb,i){rb.a0=(i*(360/Math.max(1,ribbons.length))+14)*Math.PI/180;});
}).catch(function(){});

function orb(th){var c=Math.cos(th),s=Math.sin(th);
 var m=Math.pow(Math.pow(Math.abs(c),NEXP)+Math.pow(Math.abs(s),NEXP),1/NEXP)||1;
 return [c/m,s/m];}

function frame(el){
 var P=0;
 if(el<INTRO)P=0;
 else if(el<F0)P=ease((el-INTRO)/UNFURL);
 else if(el<FEND)P=1;
 else if(el<FEND+GATHER)P=1-ease((el-FEND)/GATHER);
 var idle=(el<INTRO||el>FEND+GATHER);
 var breathe=idle?(1+0.02*Math.sin(el*1.6)):1;

 halo.setAttribute("opacity",(0.022+0.042*P).toFixed(3));
 halo.setAttribute("transform","rotate("+(el*4).toFixed(1)+" 360 210)");

 motes.forEach(function(m){
  var th=m.a+el*m.sp, o=orb(th);
  var x=CX+RX*m.f*o[0], y=CY+RY*m.f*o[1]+Math.sin(el*m.sq+m.ph)*m.bo;
  m.el.setAttribute("cx",x.toFixed(1)); m.el.setAttribute("cy",y.toFixed(1));
  m.el.setAttribute("opacity",(P*(0.07+0.15*(0.5+0.5*Math.sin(el*1.3+m.ph)))).toFixed(3));
 });
 ribbons.forEach(function(rb){
  var th=rb.a0+el*rb.sp, o=orb(th);
  var px=CX+RX*rb.rj*o[0], py=CY+RY*rb.rj*o[1]+Math.sin(el*0.8+rb.a0)*rb.bo;
  var dx=(px-rb.cx)*P, dy=(py-rb.cy)*P;
  var kk=(1+(0.34-1)*P)*breathe, ang=(th*57.3*0.14)*P;
  rb.g.setAttribute("transform","translate("+(rb.cx+dx).toFixed(1)+","+(rb.cy+dy).toFixed(1)+
   ") rotate("+ang.toFixed(1)+") scale("+kk.toFixed(3)+") translate("+(-rb.cx).toFixed(1)+","+(-rb.cy).toFixed(1)+")");
  rb.g.setAttribute("opacity",(1-0.58*P).toFixed(2));
 });

 var idx=-1,u=0;
 if(el>=F0&&el<FEND){idx=Math.floor((el-F0)/SEG);u=el-F0-idx*SEG;}

 /* لا علامة بين اللقطات — البطاقات تتسلّم بعضها مباشرة */
 line.setAttribute("opacity","0");
 spark.setAttribute("opacity","0");
 pulse.setAttribute("opacity","0");

 var anyCard=0;
 figs.forEach(function(fg,i){
  var lo=F0+i*SEG, v=el-lo;
  if(v<CARD_S-0.02||v>SEG+XOUT){ if(fg.style.opacity!=="0"){fg.style.opacity="0";fg.style.visibility="hidden";} return; }
  var tin=out5(cl((v-CARD_S)/(CARD_E-CARD_S)));         /* تصعد وتستقر */
  var tout=out3(cl((v-COUT_S)/((SEG-COUT_S)+XOUT)));    /* تتّسع وتذوب */
  var op=Math.min(tin,1-tout);
  if(op<=0.004){ if(fg.style.opacity!=="0"){fg.style.opacity="0";fg.style.visibility="hidden";} return; }
  anyCard=1;
  fg.style.visibility="visible";
  fg.style.zIndex=String(10+(tout>0.02?0:1));
  fg.style.opacity=op.toFixed(3);
  fg.style.transform="translate(-50%,-50%) scale("+(0.962+0.038*tin+0.075*tout).toFixed(3)+
   ") translateY("+((1-tin)*26-tout*30).toFixed(1)+"px)";
  var bl=(1-tin)*6.5+tout*10;
  fg.style.filter=bl>0.06?"blur("+bl.toFixed(2)+"px)":"none";
  var sh=shines[i];
  if(sh){ var k=cl((v-CARD_E+0.06)/0.58);
   sh.style.opacity=(k>0&&k<1?(0.8*Math.sin(Math.PI*k)):0).toFixed(3);
   sh.style.transform="translateX("+(-130+260*k).toFixed(1)+"%)"; }
 });

 if(idx<0){
  dotEls.forEach(function(d){d.classList.remove("on");});
  setCap(el<INTRO+UNFURL*0.5?0:CAPS.length-1);
  return;
 }
 draws[idx](Math.max(0,u-CARD_E));
 setCap(idx+1);
 dotEls.forEach(function(d,i){d.classList.toggle("on",i===idx);});
}
function setCap(i){if(i===curCap)return;curCap=i;
 capEls.forEach(function(c,k){c.classList.toggle("on",k===i);});}
function seek(t){t0=performance.now()-t*1000;curCap=-1;}
var last=performance.now();
function tick(now){
 if(!paused){ if(now-last>900) t0+=(now-last-16); last=now; frame(((now-t0)/1000)%TOTAL); }
 else last=now;
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
document.getElementById("again").addEventListener("click",function(){
 seek(0); if(paused){paused=false;document.getElementById("hold").textContent="إيقاف";}});
document.getElementById("hold").addEventListener("click",function(){
 if(paused){paused=false;t0=performance.now()-pauseAt*1000;}
 else{paused=true;pauseAt=((performance.now()-t0)/1000)%TOTAL;}
 this.textContent=paused?"تشغيل":"إيقاف";});
})();
</script></body></html>
