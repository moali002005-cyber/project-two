<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>الفيديوهات المنشورة — Flfluencer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#FBF8F6; --card:#FFFFFF; --ink:#16110F; --dim:#8A807B;
    --line:#EFE8E4; --line2:#E2D9D4; --accent:#E23B2E; --accent-soft:#FDF1F0;
    --good:#1D8F6B; --good-soft:#E8F5F0; --warn:#9A4B06; --warn-soft:#FBF0E4;
    --bad:#D7263D; --shadow:0 1px 2px rgba(22,17,15,.05), 0 8px 26px rgba(22,17,15,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
       font-size:15px;line-height:1.8;padding:24px 16px 64px}
  .wrap{max-width:860px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}
  .mast{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:20px}
  .kk{font-size:11.5px;font-weight:600;letter-spacing:2.4px;color:var(--accent);margin-bottom:8px}
  h1{font-size:clamp(21px,4.6vw,28px);font-weight:700;margin:0 0 8px;line-height:1.4;text-wrap:balance}
  .sub{font-size:14px;color:var(--dim);margin:0;line-height:1.9}
  .band{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);
        border:1px solid var(--line2);border-radius:13px;overflow:hidden;margin:18px 0 20px}
  .band>div{background:var(--card);padding:13px 12px}
  .band .v{font-size:21px;font-weight:700;letter-spacing:-.5px}
  .band .l{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
       display:flex;gap:13px;align-items:center;flex-wrap:wrap}
  .ava{width:42px;height:42px;border-radius:50%;flex:none;background:var(--accent);color:#fff;
       display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;
       background-size:cover;background-position:center}
  .who{flex:1 1 180px;min-width:0}
  .who .n{font-size:15px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
  .who .n a{color:var(--ink);text-decoration:none}
  .who .n a:hover{color:var(--accent);text-decoration:underline}
  .who .m{font-size:12.5px;color:var(--dim);line-height:1.7}
  .stats{font-size:12px;color:var(--dim);margin-top:2px}
  .acts{display:flex;gap:10px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
  .watch{background:var(--ink);color:#fff;text-decoration:none;display:inline-block;
         padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap}
  .watch:hover{background:var(--accent)}
  .watch:focus-visible,.pm button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pm{display:flex;flex-direction:column;align-items:center;gap:4px}
  .pm .lb{font-size:11px;color:var(--dim);font-weight:600}
  .pm .bt{display:flex;gap:6px}
  .pm button{font-family:inherit;cursor:pointer;width:42px;height:32px;border-radius:9px;
             border:1px solid var(--line2);background:#fff;color:var(--dim);font-size:16px;font-weight:700;
             display:flex;align-items:center;justify-content:center;padding:0}
  .pm button.y.on{background:var(--good);border-color:var(--good);color:#fff}
  .pm button.n.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .pm button:disabled{opacity:.55;cursor:default}
  .empty{background:var(--card);border:1px dashed var(--line2);border-radius:13px;
         padding:26px 22px;text-align:center;color:var(--dim);font-size:14px;line-height:1.9}
  .foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.9}
  .err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 22px;text-align:center;box-shadow:var(--shadow)}
  .err .ic{font-size:34px;margin-bottom:10px}
  .err h3{margin:0 0 8px;font-size:18px}
  .err p{margin:0;color:var(--dim);font-size:14px;line-height:1.9}
  #toast{position:fixed;inset-inline:16px;bottom:18px;max-width:420px;margin:0 auto;background:var(--ink);color:#fff;
         border-radius:12px;padding:13px 16px;font-size:13.5px;display:none;z-index:99;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  @media (max-width:560px){ .band{grid-template-columns:repeat(2,1fr)} .acts{width:100%;justify-content:space-between} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="err"><div class="ic">⏳</div><h3>جارٍ التحميل…</h3><p></p></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://chpzecgpylxqsutjydkb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNocHplY2dweWx4cXN1dGp5ZGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyODgxNzQsImV4cCI6MjA5OTg2NDE3NH0.q4wmWKtJ5IPx8AgzMkp3SuFLZL9F10qKc3qiX5LB7kI';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortN = n => { const v = Number(n)||0; return v>=1000000 ? (v/1000000).toFixed(1).replace('.0','')+'M' : v>=1000 ? (v/1000).toFixed(0)+'K' : String(v); };
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const ERRS = {
  bad_token:  ['🔗','رابط غير صالح','تأكد من نسخ الرابط كاملًا كما وصلك.'],
  expired:    ['⌛','انتهت صلاحية الرابط','هذا الرابط مؤقت وانتهت مدته. اطلب رابطًا جديدًا من فلفلونسر.'],
  revoked:    ['🚫','الرابط ملغى','تم إيقاف هذا الرابط. اطلب رابطًا جديدًا من فلفلونسر.'],
  no_campaign:['❔','الحملة غير موجودة','يبدو أن الحملة حُذفت.']
};
let DATA = null;
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(window.__tt); window.__tt=setTimeout(()=>{t.style.display='none';}, ms||3000); }
function showErr(code){ const e=ERRS[code]||['⚠️','تعذّر فتح الصفحة','يُرجى المحاولة مرة أخرى بعد قليل.'];
  $('#app').innerHTML='<div class="err"><div class="ic">'+e[0]+'</div><h3>'+esc(e[1])+'</h3><p>'+esc(e[2])+'</p></div>'; }
function fmtDate(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return '';
  return d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',timeZone:'Asia/Riyadh'})+' · '+
         d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Riyadh'}); }

function rowHtml(it){
  const acct = safeUrl(it.account), vid = safeUrl(it.publish_link);
  const ini = esc((it.name||'؟').trim().charAt(0));
  const ava = safeUrl(it.avatar) ? '<div class="ava" style="background-image:url(\''+esc(it.avatar).replace(/'/g,'%27')+'\')"></div>' : '<div class="ava">'+ini+'</div>';
  const name = acct ? '<a href="'+esc(acct)+'" target="_blank" rel="noopener">'+esc(it.name||'—')+'</a>' : esc(it.name||'—');
  const meta = [it.followers ? '<span class="num">'+shortN(it.followers)+'</span> متابع' : '', it.published_at ? 'نُشر '+esc(fmtDate(it.published_at)) : ''].filter(Boolean).join(' · ');
  const st = [it.views ? '👁 <span class="num">'+esc(it.views)+'</span>' : '', it.likes ? '♥ <span class="num">'+esc(it.likes)+'</span>' : '', it.comments ? '💬 <span class="num">'+esc(it.comments)+'</span>' : ''].filter(Boolean).join(' · ');
  const p = it.promoted;
  return '<div class="row" data-id="'+esc(it.id)+'">'+ava+
    '<div class="who"><div class="n">'+name+'</div><div class="m">'+meta+'</div>'+(st?'<div class="stats">'+st+'</div>':'')+'</div>'+
    '<div class="acts">'+
      (vid ? '<a class="watch" href="'+esc(vid)+'" target="_blank" rel="noopener">▶ مشاهدة الفيديو</a>' : '')+
      '<div class="pm"><span class="lb">تم الترويج؟</span><div class="bt">'+
        '<button class="y'+(p===true?' on':'')+'" aria-label="نعم تم الترويج" aria-pressed="'+(p===true)+'" onclick="mark(\''+esc(it.id)+'\', true, this)">✓</button>'+
        '<button class="n'+(p===false?' on':'')+'" aria-label="لا، لم يتم الترويج" aria-pressed="'+(p===false)+'" onclick="mark(\''+esc(it.id)+'\', false, this)">✕</button>'+
      '</div></div>'+
    '</div></div>';
}

function render(){
  const d = DATA, items = d.items || [];
  const yes = items.filter(i=>i.promoted===true).length, no = items.filter(i=>i.promoted===false).length;
  const brand = d.brand || '';
  $('#app').innerHTML =
    '<div class="mast"><div class="kk">FLFLUENCER · '+esc(brand)+'</div>'+
    '<h1>الفيديوهات المنشورة · '+esc(d.campaign && d.campaign.title || '')+'</h1>'+
    '<p class="sub">كل معلن ينشر يظهر هنا تلقائيًا مع رابط فيديوه. علّم ✓ إذا تم الترويج كما هو مطلوب، أو ✕ إذا لا.</p></div>'+
    '<div class="band">'+
      '<div><div class="v num">'+items.length+'</div><div class="l">نُشر</div></div>'+
      '<div><div class="v num">'+(d.awaiting_publish||0)+'</div><div class="l">وافقتم على المحتوى · بانتظار النشر</div></div>'+
      '<div><div class="v num" style="color:var(--good)">'+yes+'</div><div class="l">تم الترويج ✓</div></div>'+
      '<div><div class="v num" style="color:var(--bad)">'+no+'</div><div class="l">لم يتم الترويج ✕</div></div>'+
    '</div>'+
    (items.length ? items.map(rowHtml).join('') : '<div class="empty">ما نشر أحد إلى الآن.<br>أول ما يرفع المعلن رابط النشر يظهر هنا مباشرة.</div>')+
    '<div class="foot">الصفحة تتحدّث تلقائيًا كل دقيقة. من إجمالي <span class="num">'+(d.approved_count||0)+'</span> معلن معتمد في الحملة.</div>';
}

async function mark(id, val, btn){
  const it = (DATA.items||[]).find(x=>x.id===id); if(!it) return;
  const next = (it.promoted === val) ? null : val;   // الضغط مرة ثانية يلغي الاختيار
  const box = btn.parentNode; box.querySelectorAll('button').forEach(b=>b.disabled=true);
  const { data, error } = await sb.rpc('board_mark_promoted', { p_token: TOKEN, p_app: id, p_value: next });
  box.querySelectorAll('button').forEach(b=>b.disabled=false);
  if (error || !data || data.error){ toast('تعذّر الحفظ، حاول مرة ثانية'); return; }
  it.promoted = next; render();
  toast(next===true ? 'تم التعليم: تم الترويج ✓' : next===false ? 'تم التعليم: لم يتم الترويج ✕' : 'تم إلغاء التعليم');
}

async function load(silent){
  if (!TOKEN || TOKEN.length < 40){ showErr('bad_token'); return; }
  const { data, error } = await sb.rpc('board_published', { p_token: TOKEN });
  if (error || !data){ if(!silent) showErr('x'); return; }
  if (data.error){ showErr(data.error); return; }
  DATA = data; render();
}
load();
setInterval(()=>{ if(!document.hidden && !document.querySelector('.pm button:disabled')) load(true); }, 60000);
</script>
</body>
</html>
