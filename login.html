<!DOCTYPE html>
<html lang="ar" dir="rtl" data-i18n-title="login_title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول - Flfluencer</title>
<link rel="icon" type="image/svg+xml" href="/brand/chili.svg?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/translations.js?v=15"></script>
<script src="/i18n.js?v=5"></script>
<style>
:root {
  --cream: #ffffff;
  --cream-darker: #F3EEE4;
  --ink: #0F1420;
  --ink-soft: #2C3548;
  --ink-muted: #8A93A6;
  --ink-faint: #AAB2C0;
  --accent: #E23B2E;
  --accent-soft: #F0A79E;
  --accent-ink: #7E2119;
  --line: rgba(15, 20, 32, 0.08);
  --line-strong: rgba(15, 20, 32, 0.16);
  --font-display: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-serif: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; width: 100%; position: relative; z-index: 2; }

.nav { padding: 24px 0; border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.logo-eye { width: 44px; height: 44px; display: block; flex-shrink: 0; }
.logo-mark {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0;
  position: relative;
}
.logo-mark::after{content:none}
.back-link { color: var(--ink-soft); text-decoration: none; font-size: 14px; }
.back-link:hover { color: var(--accent); }

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  position: relative;
  z-index: 2;
}

.login-card {
  background: #fff;
  border-radius: 24px;
  padding: 48px;
  max-width: 480px;
  width: 100%;
  border: 1px solid var(--line);
  box-shadow: 0 18px 50px -28px rgba(15,20,32,.2);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--accent-ink);
  margin-bottom: 16px;
}
.eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--accent); }

h1 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-bottom: 12px;
}
h1 .italic { font-family: var(--font-display); font-style: normal; color: var(--accent); }
h1 .h1-mark { font-weight: 600; white-space: nowrap; letter-spacing: 0; }

.subtitle { font-size: 15px; color: var(--ink-soft); margin-bottom: 32px; }

.field { margin-bottom: 20px; }
.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding-inline-end: 44px; }
.pw-eye {
  position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; cursor: pointer; padding: 4px; display: flex;
  border-radius: 8px; opacity: .85; transition: opacity .15s;
}
.pw-eye:hover { opacity: 1; }
.pw-eye svg { width: 22px; height: 22px; display: block; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; }
input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 15px;
  background: #fff;
  color: var(--ink);
  transition: all 0.2s;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(226,59,46, 0.14);
}
input::placeholder { color: var(--ink-faint); }

/* خانات كود التحقق الست */
.otp-boxes { display: flex; gap: 10px; justify-content: center; direction: ltr; margin-bottom: 4px; }
.otp-boxes input {
  width: 52px; height: 60px; padding: 0;
  text-align: center; font-size: 24px; font-weight: 700;
  letter-spacing: 0; border-radius: 12px; caret-color: var(--accent);
}
.otp-boxes input.filled { border-color: var(--accent-soft); background: #FFF7F6; }
@media (max-width: 420px) {
  .otp-boxes { gap: 7px; }
  .otp-boxes input { width: 44px; height: 54px; font-size: 21px; }
}

.btn-submit {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #EE5A44, #C0231A);
  color: #fff;
  border: none;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -12px rgba(226,59,46,.65); }
.btn-submit:disabled { background: var(--ink-faint); cursor: not-allowed; transform: none; }

.tabs {
  display: flex;
  gap: 6px;
  background: var(--cream-darker);
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 11px;
  border: none;
  background: transparent;
  border-radius: 9px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(15,20,32,0.06); }
.pane { display: none; }
.pane.active { display: block; }
.muted-link {
  display: inline;
  background: none;
  border: none;
  color: var(--accent-ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}
.field-hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
.forgot-row { margin-top: 8px; text-align: start; }
.forgot-row .muted-link { font-size: 13px; }
.fp-head { margin-bottom: 20px; }
.fp-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.fp-code-input { letter-spacing: 10px; text-align: center; font-size: 22px !important; font-weight: 600; }
.fp-back { text-align: center; margin-top: 18px; }
.pw-match { font-size: 12.5px; margin-top: 6px; min-height: 18px; font-weight: 500; }
.pw-match.ok { color: #0F7A55; }
.pw-match.bad { color: #C0231A; }
.fp-done { background: #E6F6EF; border: 1px solid #BFE6D3; color: #0F5E43; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; margin-bottom: 16px; }
.tabs.hidden { display: none; }

.error-box {
  display: none;
  padding: 14px 16px;
  background: var(--cream-darker);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 20px;
}
.error-box.show { display: block; }
.error-box a { color: var(--accent-ink); font-weight: 500; text-decoration: underline; }

.bottom-link {
  text-align: center;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink-muted);
}
.bottom-link a { color: var(--accent-ink); text-decoration: none; font-weight: 500; }

.info-note {
  font-size: 13px;
  color: var(--ink-muted);
  background: var(--cream-darker);
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  line-height: 1.6;
}

@media (max-width: 540px) {
  .login-card { padding: 32px 24px; }
  h1 { font-size: 23px; }
  .logo-eye { width: 38px; height: 38px; }
}
</style>
<style>/* unified brand wordmark size */
.logo-mark{font-size:26px !important;white-space:nowrap}
@media(max-width:640px){.logo-mark{font-size:21px !important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="/" class="logo">
      
      <img src="/brand/logo-nav.svg?v=2" alt="Flfluencer" style="height:54px;display:block">
    </a>
    <div style="display:inline-flex; align-items:center; gap:14px;">
      <button type="button" data-i18n-toggle onclick="simblI18n.toggle()" style="background:#fff;border:1.5px solid rgba(15,20,32,0.28);color:var(--ink);padding:8px 16px;border-radius:100px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">EN</button>
      <a href="/" class="back-link" data-i18n="login_back">← العودة للرئيسية</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="login-card">
    <div class="eyebrow" data-i18n="login_eyebrow">تسجيل دخول</div>
    <h1><span data-i18n="login_h1">أهلاً بعودتك إلى</span> <img src="/brand/logo-nav.svg?v=2" alt="Flfluencer" style="height:2.4em;vertical-align:middle;display:inline-block"></h1>
    <p class="subtitle" data-i18n="login_subtitle">اختيار طريقة الدخول إلى الحساب.</p>

    <div class="error-box" id="error-box"></div>

    <div class="tabs" id="login-tabs">
      <button type="button" class="tab active" id="tab-password" onclick="switchTab('password')" data-i18n="login_tab_password">كلمة السر</button>
      <button type="button" class="tab" id="tab-otp" onclick="switchTab('otp')" data-i18n="login_tab_otp">كود على الإيميل</button>
    </div>

    <!-- طريقة كلمة السر -->
    <div class="pane active" id="pane-password">
      <form onsubmit="loginWithPassword(event)">
        <div class="field">
          <label data-i18n="login_email">البريد الإلكتروني</label>
          <input type="email" id="pw-email" required placeholder="example@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label data-i18n="login_password">كلمة السر</label>
          <div class="pw-wrap">
            <input type="password" id="pw-password" required placeholder="كلمة السر" data-i18n-placeholder="login_password" autocomplete="current-password">
            <button type="button" class="pw-eye" id="pw-eye-btn" onclick="togglePwVisibility()" aria-label="إظهار كلمة السر" title="إظهار كلمة السر">
              <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M1.8 12S5.5 5.5 12 5.5 22.2 12 22.2 12 18.5 18.5 12 18.5 1.8 12 1.8 12Z" stroke="#E23B2E" stroke-width="1.9" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" fill="#E23B2E"/>
              </svg>
              <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none">
                <path d="M1.8 12S5.5 5.5 12 5.5 22.2 12 22.2 12 18.5 18.5 12 18.5 1.8 12 1.8 12Z" stroke="#E23B2E" stroke-width="1.9" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" fill="#E23B2E"/>
                <path d="M4 4 L20 20" stroke="#E23B2E" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="forgot-row"><button type="button" class="muted-link" onclick="openForgot()" data-i18n="login_forgot">نسيت كلمة السر؟</button></div>
        </div>
        <button type="submit" class="btn-submit" id="pw-btn" data-i18n="login_btn">دخول</button>
      </form>
    </div>

    <!-- استرجاع كلمة السر: كود على الإيميل ← كلمة سر جديدة -->
    <div class="pane" id="pane-forgot">
      <div class="fp-head">
        <div class="fp-title" data-i18n="fp_title">استرجاع كلمة السر</div>
        <div class="field-hint" id="fp-sub" data-i18n="fp_hint">اكتب إيميلك ونرسل لك كود من 6 أرقام، وبعدها تختار كلمة سر جديدة.</div>
      </div>
      <!-- 1: الإيميل -->
      <form onsubmit="fpSend(event)" id="fp-email-form">
        <div class="field">
          <label data-i18n="login_email">البريد الإلكتروني</label>
          <input type="email" id="fp-email" required placeholder="example@email.com" autocomplete="email">
        </div>
        <button type="submit" class="btn-submit" id="fp-send-btn" data-i18n="fp_send">إرسال كود الاسترجاع</button>
      </form>
      <!-- 2: الكود -->
      <form onsubmit="fpVerify(event)" id="fp-code-form" style="display:none">
        <div class="field">
          <label><span data-i18n="login_code_to">الكود المرسل إلى</span> <span id="fp-email-label" style="color:var(--accent-ink)"></span></label>
          <input type="text" id="fp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required dir="ltr" placeholder="••••••" class="fp-code-input">
          <div class="field-hint">
            <span data-i18n="login_resend_q">ما وصلك الكود؟</span> <button type="button" class="muted-link" onclick="fpResend()" data-i18n="login_resend">إعادة الإرسال</button>
            · <button type="button" class="muted-link" onclick="fpChangeEmail()" data-i18n="login_change_email">تغيير الإيميل</button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="fp-verify-btn" data-i18n="fp_verify">تأكيد الكود</button>
      </form>
      <!-- 3: كلمة السر الجديدة -->
      <form onsubmit="fpSave(event)" id="fp-new-form" style="display:none">
        <div class="field">
          <label data-i18n="fp_new_pw">كلمة السر الجديدة</label>
          <input type="password" id="fp-pw1" required minlength="8" placeholder="8 أحرف على الأقل" autocomplete="new-password">
        </div>
        <div class="field">
          <label data-i18n="fp_confirm_pw">تأكيد كلمة السر</label>
          <input type="password" id="fp-pw2" required minlength="8" placeholder="اكتبها مرة ثانية" autocomplete="new-password">
          <div class="pw-match" id="fp-match"></div>
        </div>
        <button type="submit" class="btn-submit" id="fp-save-btn" data-i18n="fp_save">حفظ كلمة السر والدخول</button>
      </form>
      <p class="fp-back"><button type="button" class="muted-link" onclick="closeForgot()" data-i18n="fp_back">← الرجوع لتسجيل الدخول</button></p>
    </div>

    <!-- طريقة كود الإيميل (OTP) -->
    <div class="pane" id="pane-otp">
      <!-- الخطوة 1: إدخال الإيميل -->
      <form onsubmit="sendOtp(event)" id="otp-email-form">
        <div class="field">
          <label data-i18n="login_email">البريد الإلكتروني</label>
          <input type="email" id="otp-email" required placeholder="example@email.com" autocomplete="email">
          <div class="field-hint" data-i18n="login_otp_hint">نرسل لك كود مكوّن من 6 أرقام على بريدك.</div>
        </div>
        <button type="submit" class="btn-submit" id="otp-send-btn" data-i18n="login_send_code">إرسال الكود</button>
      </form>
      <!-- الخطوة 2: إدخال الكود -->
      <form onsubmit="verifyOtp(event)" id="otp-code-form" style="display:none">
        <div class="field">
          <label><span data-i18n="login_code_to">الكود المرسل إلى</span> <span id="otp-email-label" style="color:var(--accent-ink)"></span></label>
          <div class="otp-boxes" id="otp-boxes" dir="ltr">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="1">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="2">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="3">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="4">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="5">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="6">
          </div>
          <input type="hidden" id="otp-code">
          <div class="field-hint">
            <span data-i18n="login_resend_q">ما وصلك الكود؟</span> <button type="button" class="muted-link" onclick="resendOtp()" data-i18n="login_resend">إعادة الإرسال</button>
            · <button type="button" class="muted-link" onclick="resetOtp()" data-i18n="login_change_email">تغيير الإيميل</button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="otp-verify-btn" data-i18n="login_verify_btn">تأكيد ودخول</button>
      </form>
    </div>

    <p class="bottom-link"><span data-i18n="login_no_account">ما عندك حساب بعد؟</span> <a href="/signup.html" data-i18n="login_register">التسجيل الآن</a></p>
  </div>
</main>

<script>document.write('<script src="supabase-config.js?v=' + Date.now() + '"><\/script>');</script>
<script>
function switchTab(which) {
  const isPw = which === 'password';
  document.getElementById('tab-password').classList.toggle('active', isPw);
  document.getElementById('tab-otp').classList.toggle('active', !isPw);
  document.getElementById('pane-password').classList.toggle('active', isPw);
  document.getElementById('pane-otp').classList.toggle('active', !isPw);
  document.getElementById('pane-forgot').classList.remove('active');
  document.getElementById('login-tabs').classList.remove('hidden');
  hideError();
}

// ===== نسيت كلمة السر: كود على الإيميل ← تحقق ← كلمة سر جديدة =====
let fpEmail = '';
let fpBusy = false;
function fpStep(n) {
  document.getElementById('fp-email-form').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('fp-code-form').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('fp-new-form').style.display = n === 3 ? 'block' : 'none';
  const sub = document.getElementById('fp-sub');
  if (sub) sub.style.display = n === 1 ? 'block' : 'none';
}
function openForgot() {
  hideError();
  const typed = (document.getElementById('pw-email').value || '').trim();
  if (typed) document.getElementById('fp-email').value = typed;
  document.getElementById('pane-password').classList.remove('active');
  document.getElementById('pane-otp').classList.remove('active');
  document.getElementById('pane-forgot').classList.add('active');
  document.getElementById('login-tabs').classList.add('hidden');
  fpStep(1);
  setTimeout(() => document.getElementById('fp-email').focus(), 50);
}
function closeForgot() {
  switchTab('password');
  if (fpEmail) document.getElementById('pw-email').value = fpEmail;
}
function fpChangeEmail() { hideError(); document.getElementById('fp-code').value = ''; fpStep(1); }
function fpResend() { if (fpEmail) fpSend(); }
function fpDigits(s) {
  // يقبل الأرقام العربية ويحوّلها للاتينية
  return String(s || '').replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0)).replace(/\D/g, '');
}
async function fpSend(event) {
  if (event) event.preventDefault();
  if (fpBusy) return;
  hideError();
  const inp = document.getElementById('fp-email');
  fpEmail = (inp.value || '').trim().toLowerCase();
  if (!fpEmail) return;
  const btn = document.getElementById('fp-send-btn');
  fpBusy = true; btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    const { error } = await supabaseClient.auth.signInWithOtp({ email: fpEmail, options: { shouldCreateUser: false } });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('not') && (m.includes('found') || m.includes('exist') || m.includes('signups'))) {
        showError('لا يوجد حساب بهذا البريد. <a href="/signup.html">تسجيل حساب جديد</a>');
      } else if (m.includes('second') || m.includes('rate') || m.includes('limit')) {
        showError('أرسلنا لك كود قبل شوي — انتظر دقيقة وجرّب مرة ثانية.');
      } else {
        showError('تعذّر إرسال الكود. تأكد من الإيميل وجرّب مرة ثانية.');
      }
      return;
    }
    document.getElementById('fp-email-label').textContent = fpEmail;
    fpStep(2);
    setTimeout(() => document.getElementById('fp-code').focus(), 50);
  } catch (e) {
    console.error(e);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
  } finally {
    fpBusy = false; btn.disabled = false; btn.textContent = 'إرسال كود الاسترجاع';
  }
}
async function fpVerify(event) {
  event.preventDefault();
  hideError();
  const token = fpDigits(document.getElementById('fp-code').value);
  if (token.length !== 6) { showError('الكود 6 أرقام — تأكد منه.'); return; }
  const btn = document.getElementById('fp-verify-btn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  try {
    const { error } = await supabaseClient.auth.verifyOtp({ email: fpEmail, token, type: 'email' });
    if (error) {
      showError('الكود غير صحيح أو منتهي. أعد المحاولة أو اطلب كود جديد.');
      document.getElementById('fp-code').value = '';
      return;
    }
    fpStep(3);
    setTimeout(() => document.getElementById('fp-pw1').focus(), 50);
  } catch (e) {
    console.error(e);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
  } finally {
    btn.disabled = false; btn.textContent = 'تأكيد الكود';
  }
}
function fpCheckMatch() {
  const a = document.getElementById('fp-pw1').value;
  const b = document.getElementById('fp-pw2');
  const hint = document.getElementById('fp-match');
  if (!b.value) { hint.textContent = ''; hint.className = 'pw-match'; b.setCustomValidity(''); return; }
  const ok = a === b.value;
  hint.textContent = ok ? '✓ كلمتا السر متطابقتين' : '✗ كلمتا السر غير متطابقتين';
  hint.className = 'pw-match ' + (ok ? 'ok' : 'bad');
  b.setCustomValidity(ok ? '' : 'كلمتا السر غير متطابقتين');
}
document.addEventListener('DOMContentLoaded', () => {
  ['fp-pw1', 'fp-pw2'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('input', fpCheckMatch); });
  const c = document.getElementById('fp-code');
  if (c) c.addEventListener('input', () => { const d = fpDigits(c.value).slice(0, 6); if (c.value !== d) c.value = d; });
  try { if (new URLSearchParams(location.search).has('forgot')) openForgot(); } catch (e) {}
});
async function fpSave(event) {
  event.preventDefault();
  hideError();
  const p1 = document.getElementById('fp-pw1').value;
  const p2 = document.getElementById('fp-pw2').value;
  if (p1.length < 8) { showError('كلمة السر لازم تكون 8 أحرف على الأقل.'); return; }
  if (p1 !== p2) { showError('كلمتا السر غير متطابقتين.'); fpCheckMatch(); return; }
  const btn = document.getElementById('fp-save-btn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    const { data, error } = await supabaseClient.auth.updateUser({ password: p1 });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('different') || m.includes('same')) showError('هذي نفس كلمة السر القديمة — اختر كلمة سر جديدة.');
      else if (m.includes('weak') || m.includes('at least') || m.includes('length')) showError('كلمة السر ضعيفة — اختر 8 أحرف أو أكثر.');
      else if (m.includes('session') || m.includes('reauth') || m.includes('jwt')) { showError('انتهت الجلسة — اطلب كود جديد.'); fpStep(1); }
      else showError('تعذّر حفظ كلمة السر. يُرجى المحاولة مرة أخرى.');
      btn.disabled = false; btn.textContent = 'حفظ كلمة السر والدخول';
      return;
    }
    const box = document.getElementById('fp-new-form');
    box.insertAdjacentHTML('afterbegin', '<div class="fp-done">✓ تم تغيير كلمة السر — جاري الدخول...</div>');
    await finishLogin(fpEmail, data && data.user);
  } catch (e) {
    console.error(e);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
    btn.disabled = false; btn.textContent = 'حفظ كلمة السر والدخول';
  }
}

function showError(html) {
  const box = document.getElementById('error-box');
  box.innerHTML = html;
  box.classList.add('show');
}
function hideError() {
  document.getElementById('error-box').classList.remove('show');
}

// بعد نجاح المصادقة: نجيب ملف المستخدم من جدول users ونوجّهه

// وجهة ما بعد الدخول: رابط حملة حُفظ قبل التحويل — مسارات داخلية فقط، بلا إعادة توجيه خارجية
function flfAfterLogin(def) {
  try {
    const t = localStorage.getItem('flf_after_login') || '';
    localStorage.removeItem('flf_after_login');
    if (/^\/creator\.html(\?[^\s]*)?$/.test(t)) return t;
  } catch (e) { /* تجاهل */ }
  return def;
}

async function finishLogin(email, authUser) {
  let profile = null;

  // نحاول الربط عبر auth_id أولاً
  if (authUser && authUser.id) {
    const { data } = await supabaseClient
      .from('users').select('id, role, name, platform, handle, followers, category, bio, company_name, industry, size, position, website, created_at, auth_id, approval_status, cr_number, is_test, avatar_url, country, city, creator_tier').eq('auth_id', authUser.id).maybeSingle();
    profile = data || null;
  }
  // احتياطي: عبر دالة آمنة تُرجّع ملف المتصل نفسه فقط (ونربط auth_id لو ناقص)
  if (!profile && email) {
    const { data } = await supabaseClient.rpc('simbl_find_own_profile');
    profile = (Array.isArray(data) && data[0]) ? data[0] : null;
    if (profile && authUser && authUser.id && !profile.auth_id) {
      try {
        await supabaseClient.from('users').update({ auth_id: authUser.id }).eq('id', profile.id);
      } catch (e) {}
    }
  }

  if (!profile) {
    // حساب مصادقة صحيح لكن بلا ملف (يتيم) — نبقي الجلسة ونوجّهه لإكمال ملفه
    // بدل الطريق المسدود. صفحة التسجيل تكتشف الجلسة وتفتح «وضع الإكمال».
    window.location.href = '/signup.html?complete=1';
    return false;
  }

  saveCurrentUser(profile);
  if (profile.role === 'creator') {
    window.location.href = flfAfterLogin('/creator.html');
  } else if (profile.role === 'brand') {
    window.location.href = '/brand.html';
  } else {
    showError('نوع الحساب غير معروف.');
    return false;
  }
  return true;
}

// إظهار/إخفاء كلمة السر (يكشف فقط ما كتبه المستخدم — آمن)
function togglePwVisibility() {
  const inp = document.getElementById('pw-password');
  const btn = document.getElementById('pw-eye-btn');
  if (!inp) return;
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  if (btn) {
    const open = btn.querySelector('.pw-eye-open');
    const off = btn.querySelector('.pw-eye-off');
    if (open) open.style.display = show ? 'none' : 'block';
    if (off) off.style.display = show ? 'block' : 'none';
    btn.setAttribute('aria-label', show ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
    btn.setAttribute('title', show ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
  }
}
async function loginWithPassword(event) {
  event.preventDefault();
  hideError();
  const email = document.getElementById('pw-email').value.trim().toLowerCase();
  const password = document.getElementById('pw-password').value;
  const btn = document.getElementById('pw-btn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      if ((error.message || '').toLowerCase().includes('invalid')) {
        showError('البريد الإلكتروني أو كلمة السر غير صحيحة.');
      } else {
        showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
      }
      btn.disabled = false; btn.textContent = 'دخول';
      return;
    }
    await finishLogin(email, data.user);
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
    btn.disabled = false; btn.textContent = 'دخول';
  }
}

// ===== طريقة كود الإيميل (OTP) =====
let otpEmail = '';

async function sendOtp(event) {
  if (event) event.preventDefault();
  hideError();
  otpEmail = document.getElementById('otp-email').value.trim().toLowerCase();
  const btn = document.getElementById('otp-send-btn');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...';

  try {
    // shouldCreateUser:false → لا ننشئ حساب جديد من صفحة الدخول
    const { error } = await supabaseClient.auth.signInWithOtp({
      email: otpEmail,
      options: { shouldCreateUser: false }
    });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('not') && (m.includes('found') || m.includes('exist') || m.includes('signups'))) {
        showError('لا يوجد حساب بهذا البريد. <a href="/signup.html">تسجيل حساب جديد</a>');
      } else {
        showError('تعذّر إرسال الكود. يُرجى التحقق من البريد والمحاولة مرة أخرى.');
      }
      btn.disabled = false; btn.textContent = 'إرسال الكود';
      return;
    }
    document.getElementById('otp-email-label').textContent = otpEmail;
    document.getElementById('otp-email-form').style.display = 'none';
    document.getElementById('otp-code-form').style.display = 'block';
    if (window.__otpFocus) window.__otpFocus();
    btn.disabled = false; btn.textContent = 'إرسال الكود';
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
    btn.disabled = false; btn.textContent = 'إرسال الكود';
  }
}

function resendOtp() { if (otpEmail) sendOtp(); }
function resetOtp() {
  hideError();
  document.getElementById('otp-code-form').style.display = 'none';
  document.getElementById('otp-email-form').style.display = 'block';
  if (window.__otpClear) window.__otpClear();
}

// ===== خانات الكود الست: تنقّل تلقائي، لصق، أرقام عربية، إرسال فوري عند الاكتمال =====
(function initOtpBoxes() {
  var wrap = document.getElementById('otp-boxes');
  var hidden = document.getElementById('otp-code');
  if (!wrap || !hidden) return;
  var boxes = Array.prototype.slice.call(wrap.querySelectorAll('input'));

  // أرقام لاتينية فقط (0-9). أي رمز آخر — بما فيه الأرقام العربية والفارسية — يُرفض.
  function toLatinDigits(str) {
    var out = '';
    var t = String(str == null ? '' : str);
    for (var i = 0; i < t.length; i++) {
      var cc = t.charCodeAt(i);
      if (cc >= 48 && cc <= 57) { out += t.charAt(i); }
    }
    return out;
  }

  function sync() {
    var v = '';
    for (var i = 0; i < boxes.length; i++) {
      v += boxes[i].value;
      if (boxes[i].value) { boxes[i].classList.add('filled'); }
      else { boxes[i].classList.remove('filled'); }
    }
    hidden.value = v;
    return v;
  }

  function focusAt(i) {
    if (i < 0) i = 0;
    if (i > boxes.length - 1) i = boxes.length - 1;
    boxes[i].focus();
    try { boxes[i].select(); } catch (e) {}
  }

  function maybeSubmit(v) {
    if (v.length !== boxes.length) return;
    var btn = document.getElementById('otp-verify-btn');
    if (btn && !btn.disabled) btn.click();
  }

  function fillFrom(index, digits) {
    for (var k = 0; k < digits.length && index + k < boxes.length; k++) {
      boxes[index + k].value = digits.charAt(k);
    }
    var last = Math.min(index + digits.length, boxes.length - 1);
    focusAt(last);
    maybeSubmit(sync());
  }

  boxes.forEach(function (b, i) {
    b.addEventListener('input', function () {
      var d = toLatinDigits(b.value);
      if (d.length > 1) { b.value = ''; fillFrom(i, d); return; }
      b.value = d;
      if (d) focusAt(i + 1);
      maybeSubmit(sync());
    });

    b.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace') {
        if (!b.value && i > 0) { e.preventDefault(); boxes[i - 1].value = ''; sync(); focusAt(i - 1); }
        return;
      }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); focusAt(i - 1); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); focusAt(i + 1); return; }
    });

    b.addEventListener('paste', function (e) {
      e.preventDefault();
      var cd = e.clipboardData || window.clipboardData;
      var d = toLatinDigits(cd ? cd.getData('text') : '');
      if (!d) return;
      for (var k = 0; k < boxes.length; k++) boxes[k].value = '';
      fillFrom(0, d.slice(0, boxes.length));
    });

    b.addEventListener('focus', function () { try { b.select(); } catch (e) {} });
  });

  window.__otpClear = function () {
    for (var i = 0; i < boxes.length; i++) boxes[i].value = '';
    sync();
  };
  window.__otpFocus = function () { focusAt(0); };
})();

async function verifyOtp(event) {
  event.preventDefault();
  hideError();
  const token = document.getElementById('otp-code').value.trim();
  const btn = document.getElementById('otp-verify-btn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try {
    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: otpEmail,
      token,
      type: 'email'
    });
    if (error) {
      showError('الكود غير صحيح أو منتهي. أعد المحاولة.');
      if (window.__otpClear) window.__otpClear();
      if (window.__otpFocus) window.__otpFocus();
      btn.disabled = false; btn.textContent = 'تأكيد ودخول';
      return;
    }
    await finishLogin(otpEmail, data.user);
  } catch (err) {
    console.error(err);
    showError('حصل خطأ. يُرجى المحاولة مرة أخرى.');
    btn.disabled = false; btn.textContent = 'تأكيد ودخول';
  }
}
